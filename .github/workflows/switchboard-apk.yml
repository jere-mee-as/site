# Builds the Switchboard APK on demand (Actions tab > Switchboard APK > Run workflow). Never runs on push or on a schedule.
# Its own repo secrets: SB_KEYSTORE_B64 (base64 of the .jks), SB_KEYSTORE_PASSWORD, SB_KEY_ALIAS, SB_KEY_PASSWORD.
# Without SB_KEYSTORE_B64 the build still runs and the APK is debug-signed.
name: Switchboard APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: switchboard/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            switchboard/android/**/*.gradle.kts
            switchboard/android/gradle/libs.versions.toml
            switchboard/android/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          SB_KEYSTORE_B64: ${{ secrets.SB_KEYSTORE_B64 }}
        run: |
          if [ -n "$SB_KEYSTORE_B64" ]; then
            ks="$RUNNER_TEMP/sb-release.jks"
            echo "$SB_KEYSTORE_B64" | base64 --decode > "$ks"
            echo "SB_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"
          else
            echo "::warning::SB_KEYSTORE_B64 is not set; the APK will be debug-signed."
          fi

      - name: Build release APK
        env:
          SB_KEYSTORE_PASSWORD: ${{ secrets.SB_KEYSTORE_PASSWORD }}
          SB_KEY_ALIAS: ${{ secrets.SB_KEY_ALIAS }}
          SB_KEY_PASSWORD: ${{ secrets.SB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sb-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: switchboard-apk
          path: switchboard/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
