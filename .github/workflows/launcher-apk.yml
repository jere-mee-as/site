# Builds the JRL launcher APK on demand (Actions tab > Launcher APK > Run workflow). Never runs on push or on a schedule.
# Each run replaces the release tagged jrl-launcher: https://github.com/jere-mee-as/site/releases/download/jrl-launcher/jrl-launcher.apk
# Repo secrets: JRL_KEYSTORE_B64 (base64 of the .jks), JRL_KEYSTORE_PASSWORD, JRL_KEY_ALIAS, JRL_KEY_PASSWORD.
# Without JRL_KEYSTORE_B64 the build still runs and the APK is debug-signed.
name: Launcher APK

on:
  workflow_dispatch:

permissions:
  contents: write # publishes the APK as a release (rolling tag) so phones can download it without signing in

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            launcher/android/**/*.gradle.kts
            launcher/android/gradle/libs.versions.toml
            launcher/android/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          JRL_KEYSTORE_B64: ${{ secrets.JRL_KEYSTORE_B64 }}
        run: |
          if [ -n "$JRL_KEYSTORE_B64" ]; then
            ks="$RUNNER_TEMP/jrl-release.jks"
            echo "$JRL_KEYSTORE_B64" | base64 --decode > "$ks"
            echo "JRL_KEYSTORE_PATH=$ks" >> "$GITHUB_ENV"
          else
            echo "::warning::JRL_KEYSTORE_B64 is not set; the APK will be debug-signed."
          fi

      - name: Build release APK
        env:
          JRL_KEYSTORE_PASSWORD: ${{ secrets.JRL_KEYSTORE_PASSWORD }}
          JRL_KEY_ALIAS: ${{ secrets.JRL_KEY_ALIAS }}
          JRL_KEY_PASSWORD: ${{ secrets.JRL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/jrl-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: jrl-launcher-apk
          path: launcher/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release (jrl-launcher)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" "$RUNNER_TEMP/jrl-launcher.apk"
          ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release delete jrl-launcher --yes --cleanup-tag || true
          gh release create jrl-launcher "$RUNNER_TEMP/jrl-launcher.apk" \
            --target "$GITHUB_SHA" \
            --title "JRL Launcher $ver" \
            --notes "JRL Launcher $ver, built from ${GITHUB_SHA::7}. On the phone: open jrl-launcher.apk, allow the install, then App info > ⋮ > Allow restricted settings before granting notification access."
