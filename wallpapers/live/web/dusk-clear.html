  --sky-top:#111925; --sky-bottom:#263145; --glow:rgba(150,172,214,.16);
  --ink:#e9edf3; --ink-2:#d0d7e1; --mute:#a3adbb; --line:rgba(233,237,243,.14); --shade:rgba(0,0,0,.6);

<style>html,body{height:100%;margin:0;overflow:hidden}</style>
</head><body>
<div class="sky" aria-hidden="true">
  <div class="stars"></div>
  <div class="layer l1"><i class="cl a"></i><i class="cl b"></i></div>
  <div class="layer l2"><i class="cl c"></i><i class="cl d"></i></div>
  <div class="layer l3"><i class="cl e"></i><i class="cl f"></i></div>
  <div class="overcast"></div>
  <canvas id="rain"></canvas>
  <div class="bolt"></div>
</div>
<script>
(function () {
  var root = document.documentElement;
  var q = new URLSearchParams(location.search);
  var parts = (location.hash.slice(1) || 'dusk-clear').split('-');
  var sky = q.get('sky') || parts[0], w = q.get('weather') || parts[1] || 'clear';
  root.setAttribute('data-sky', sky);
  if (w !== 'clear') root.setAttribute('data-weather', w);
  var rain = (function () {
    var cv = document.getElementById('rain'), bolt = document.querySelector('.bolt');
    var ctx = cv.getContext('2d'), drops = [], mode = '', raf = 0, last = 0, boltT = 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function size() {
      var d = Math.min(2, devicePixelRatio || 1);
      cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    function seed() {
      var n = Math.round(innerWidth * innerHeight / (mode === 'storm' ? 5200 : 9500));
      drops = [];
      for (var i = 0; i < n; i++) drops.push({ x: Math.random() * innerWidth * 1.2, y: Math.random() * innerHeight, l: 9 + Math.random() * 12, v: 520 + Math.random() * 340, a: .35 + Math.random() * .65 });
    }
    function color() { return root.getAttribute('data-sky') === 'night' ? '205,215,235' : '70,86,104'; }
    function frame(t) {
      raf = requestAnimationFrame(frame);
      var dt = Math.min(.05, (t - (last || t)) / 1000); last = t;
      var wind = mode === 'storm' ? .22 : .12, c = color(), base = mode === 'storm' ? .26 : .2;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.lineWidth = 1; ctx.lineCap = 'round';
      for (var i = 0; i < drops.length; i++) {
        var p = drops[i];
        p.y += p.v * dt; p.x -= p.v * wind * dt;
        if (p.y > innerHeight + 20) { p.y = -20; p.x = Math.random() * innerWidth * 1.2; }
        if (p.x < -20) p.x += innerWidth + 40;
        ctx.strokeStyle = 'rgba(' + c + ',' + (base * p.a).toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.l * wind, p.y - p.l); ctx.stroke();
      }
      if (mode === 'storm' && t > boltT) {
        boltT = t + 7000 + Math.random() * 12000;
        bolt.classList.remove('on'); void bolt.offsetWidth; bolt.classList.add('on');
      }
    }
    addEventListener('resize', function () { if (mode) { size(); seed(); } });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (mode && !still && !raf) { last = 0; raf = requestAnimationFrame(frame); }
    });
    return { set: function (m) {
      if (m === mode) return;
      mode = m; cancelAnimationFrame(raf); raf = 0; ctx.clearRect(0, 0, cv.width, cv.height);
      if (!m || still) return;
      size(); seed(); boltT = performance.now() + 2500; last = 0; raf = requestAnimationFrame(frame);
    } };
  })();
  rain.set(w === 'clear' ? '' : w);
  addEventListener('pointermove', function (e) {
    root.style.setProperty('--px', (-(e.clientX / innerWidth * 2 - 1)).toFixed(3));
    root.style.setProperty('--py', (-(e.clientY / innerHeight * 2 - 1)).toFixed(3));
  });
})();
</script>
</body></html>
