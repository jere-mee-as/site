<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cyberpunk</title>
<meta name="description" content="Cyberpunk on its own screens: a fogged window over the city, a CRT, a CCTV feed, an AR overlay that tags a body, neon signage in kanji and hangul. One frame at a time, rain underneath.">
<meta name="theme-color" content="#05060a">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600&family=Share+Tech+Mono&family=VT323&family=Noto+Sans+JP:wght@300;500&family=Noto+Sans+KR:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#05060a;
  --ink:#ece8e1;
  --dim:rgba(236,232,225,.55);
  --mag:#ff2f7e;
  --cya:#3eeaff;
  --amb:#ffae42;
  --chrome:#c7ced6;
  --disp:"Chakra Petch","Fira Sans","TeX Gyre Adventor","DejaVu Sans",sans-serif;
  --hud:"Share Tech Mono","DejaVu Sans Mono","Liberation Mono",Menlo,monospace;
  --crt:"VT323","Unifont","DejaVu Sans Mono",monospace;
  --jp:"Noto Sans JP","Noto Sans CJK JP","IPAPGothic",sans-serif;
  --kr:"Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --ease:cubic-bezier(.22,.61,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--night)}
body{color:var(--ink);font-family:var(--disp);-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:default;overscroll-behavior:none}
img{-webkit-user-drag:none;user-select:none;pointer-events:none}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ================= beats + transitions ================= */
.beat{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity 1.2s var(--ease),visibility 0s linear 1.2s;overflow:hidden}
.beat.on{opacity:1;visibility:visible;transition:opacity 1.2s var(--ease),visibility 0s}
.beat.t-cut,.beat.t-cut.on{transition:none}
.beat.t-hold.on{transition:opacity 2.2s var(--ease) .7s,visibility 0s}
.beat.t-glitch.on{transition:none;animation:glitch .62s steps(1,end) both}
@keyframes glitch{
  0%{clip-path:inset(12% 0 62% 0);transform:translateX(-26px);filter:hue-rotate(80deg) saturate(3)}
  9%{clip-path:inset(58% 0 8% 0);transform:translateX(30px)}
  17%{clip-path:inset(0 0 84% 0);transform:translateX(-8px);filter:invert(1)}
  26%{clip-path:inset(30% 0 40% 0);transform:translateX(16px);filter:none}
  38%{clip-path:inset(70% 0 0 0);transform:translateX(-40px);filter:hue-rotate(-60deg) saturate(2)}
  50%{clip-path:inset(0 0 30% 0);transform:translateX(6px);filter:none}
  64%{clip-path:inset(20% 0 0 0);transform:translateX(-3px)}
  78%{clip-path:inset(0);transform:translateX(2px)}
  100%{clip-path:inset(0);transform:none;filter:none}
}
.beat.t-scan.on{transition:none;animation:scan 1.1s cubic-bezier(.45,.05,.4,1) both}
@keyframes scan{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
#scanline{position:fixed;left:0;right:0;top:0;height:2px;z-index:9;pointer-events:none;opacity:0;
  background:var(--cya);box-shadow:0 0 10px var(--cya),0 0 30px var(--cya),0 0 60px rgba(62,234,255,.5)}
#scanline.go{animation:scanl 1.1s cubic-bezier(.45,.05,.4,1) both}
@keyframes scanl{0%{top:0;opacity:1}92%{opacity:1}100%{top:100%;opacity:0}}
#glitch{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;mix-blend-mode:screen}
#glitch.go{animation:gl .62s steps(1,end) both}
#glitch i{position:absolute;left:0;right:0;display:block}
@keyframes gl{0%,70%{opacity:1}71%,100%{opacity:0}}

/* ================= shared photo frame ================= */
.win{position:absolute;inset:0;overflow:hidden;background:#000}
.pane{position:absolute;inset:0;transform:scale(1.06);transition:transform 16s cubic-bezier(.2,.5,.3,1)}
.beat.on .pane{transform:scale(1)}
.pane img,.pane canvas.src{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pane canvas.glass{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.win::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
.full .win::before,.fog.wide .win::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(to top,rgba(4,5,8,.9) 0%,rgba(4,5,8,.55) 28%,transparent 54%),
             linear-gradient(to right,rgba(4,5,8,.5) 0%,transparent 45%)}

/* ================= type ================= */
.txt{position:absolute;z-index:3;left:clamp(20px,6vw,96px);bottom:clamp(70px,11vh,120px);max-width:min(640px,84vw)}
.tag{font:400 11px/1 var(--hud);letter-spacing:.2em;text-transform:uppercase;color:var(--cya);opacity:.85;margin-bottom:14px;
  display:flex;gap:10px;align-items:center}
.tag::before{content:"";width:7px;height:7px;background:var(--cya);box-shadow:0 0 8px var(--cya)}
.tag.m{color:var(--mag)}.tag.m::before{background:var(--mag);box-shadow:0 0 8px var(--mag)}
.tag.a{color:var(--amb)}.tag.a::before{background:var(--amb);box-shadow:0 0 8px var(--amb)}
.h{position:relative;font-family:var(--disp);font-weight:500;text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(34px,4.4vw,66px);line-height:1;color:#fff4f8;white-space:pre-line;--c:var(--mag);--c2:rgba(255,47,126,.45)}
.neon .h,.h.neon{--glow:0 0 1px #fff,0 0 6px var(--c),0 0 16px var(--c),0 0 40px var(--c),0 0 80px var(--c2);text-shadow:var(--glow)}
.h.cya{--c:var(--cya);--c2:rgba(62,234,255,.42);color:#effdff}
.h.amb{--c:var(--amb);--c2:rgba(255,174,66,.42);color:#fff8ec}
.h.big{font-size:clamp(54px,9.4vw,150px);letter-spacing:.04em;font-weight:600}
.neon.on .h{animation:ignite 1.5s steps(1,end) .45s both}
@keyframes ignite{
  0%{opacity:.08;text-shadow:none} 8%{opacity:.9;text-shadow:var(--glow)} 11%{opacity:.12;text-shadow:none}
  22%{opacity:1;text-shadow:var(--glow)} 25%{opacity:.25;text-shadow:none} 31%{opacity:.95;text-shadow:var(--glow)}
  33%{opacity:.4;text-shadow:none} 40%,100%{opacity:1;text-shadow:var(--glow)}}
.v{margin-top:clamp(18px,2.6vh,28px);font:400 clamp(17px,1.45vw,21px)/1.42 var(--disp);color:var(--ink);max-width:560px;
  text-shadow:0 1px 14px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.8);opacity:0;transform:translateY(8px);
  transition:opacity 1.3s var(--ease) 1.3s,transform 1.3s var(--ease) 1.3s}
.n{margin-top:14px;font:400 11px/1.6 var(--hud);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  opacity:0;transition:opacity 1.2s var(--ease) 2.1s;text-shadow:0 1px 8px #000}
.beat.on .v{opacity:1;transform:none}
.beat.on .n{opacity:1}

/* side layout (portrait frames) on wide screens */
@media (min-aspect-ratio:1/1){
  .side .win{left:auto;right:clamp(28px,6vw,110px);top:7vh;bottom:7vh;width:auto;aspect-ratio:var(--ar);max-width:52vw;box-shadow:0 30px 90px rgba(0,0,0,.6)}
  .side .txt{bottom:auto;top:50%;transform:translateY(-50%);max-width:min(38vw,560px)}
}
/* phone */
@media (max-aspect-ratio:1/1){
  .txt{left:20px;right:20px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:none}
  .h{font-size:clamp(30px,9vw,50px)}
  .h.big{font-size:clamp(46px,14vw,104px)}
  .v{font-size:clamp(16px,4.4vw,19px)}
  .scope{display:flex;flex-direction:column;justify-content:center;padding-bottom:8vh}
  .scope .win{position:relative;inset:auto;flex:none;width:100%;height:min(calc(100vw / var(--ar) * 1.3),46vh)}
  .scope .win::before{display:none!important}
  .scope .txt{position:relative;left:auto;right:auto;bottom:auto;padding:28px 20px 0}
  .side .win::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(to top,rgba(4,5,8,.92) 0%,rgba(4,5,8,.6) 32%,transparent 60%)}
}

/* ================= SIGN: chapter cards ================= */
.sign{background:radial-gradient(ellipse 70% 60% at 50% 120%,rgba(255,47,126,.10),transparent 70%),#05060a}
.sign .rain{position:absolute;inset:0;opacity:.5}
.sign .board{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(28px,6vw,100px);padding:40px 24px 80px}
.kj{writing-mode:vertical-rl;font-family:var(--jp);font-weight:300;font-size:clamp(90px,17vh,190px);line-height:1;letter-spacing:.06em;
  color:#fff1f6;padding:.18em .12em;border:2px solid rgba(255,47,126,.75);border-radius:10px;--c:var(--mag);
  --glow:0 0 2px #fff,0 0 10px var(--c),0 0 26px var(--c),0 0 60px var(--c);text-shadow:var(--glow);
  box-shadow:0 0 12px rgba(255,47,126,.6),inset 0 0 12px rgba(255,47,126,.45),0 0 50px rgba(255,47,126,.25)}
.kj.kr{font-family:var(--kr)}
.kj.c{--c:var(--cya);color:#eefcff;border-color:rgba(62,234,255,.75);box-shadow:0 0 12px rgba(62,234,255,.6),inset 0 0 12px rgba(62,234,255,.45),0 0 50px rgba(62,234,255,.25)}
.kj.a{--c:var(--amb);color:#fff6e8;border-color:rgba(255,174,66,.75);box-shadow:0 0 12px rgba(255,174,66,.6),inset 0 0 12px rgba(255,174,66,.45),0 0 50px rgba(255,174,66,.25)}
.sign.on .kj{animation:ignite2 1.8s steps(1,end) .3s both}
@keyframes ignite2{0%{opacity:.06;text-shadow:none}10%{opacity:1;text-shadow:var(--glow)}13%{opacity:.1;text-shadow:none}
  26%{opacity:1;text-shadow:var(--glow)}29%{opacity:.3}36%,100%{opacity:1;text-shadow:var(--glow)}}
.kj-ref{position:absolute;left:50%;top:100%;transform:translateX(-50%)}
.sign .col{max-width:430px}
.sign .ch{font:400 12px/1 var(--hud);letter-spacing:.32em;color:var(--dim);text-transform:uppercase}
.sign .rom{font:400 12px/1 var(--hud);letter-spacing:.26em;color:var(--mag);margin-top:10px;text-transform:uppercase}
.sign .h{margin-top:26px;font-weight:600;font-size:clamp(34px,4.2vw,60px)}
.sign .v{margin-top:18px}
@media (max-aspect-ratio:1/1){
  .sign .board{flex-direction:column;gap:30px;justify-content:center;padding-bottom:100px}
  .kj{writing-mode:horizontal-tb;font-size:clamp(78px,24vw,130px);padding:.12em .22em}
  .sign .col{text-align:left;width:100%;padding:0 4px}
  .sign .h{margin-top:18px}
}

/* ================= CRT ================= */
.crtb{display:flex;align-items:center;justify-content:center;gap:clamp(30px,5vw,80px);position:absolute;inset:0;padding:40px clamp(20px,5vw,80px) 80px}
.tv{position:relative;flex:none;width:min(56vw,880px);padding:clamp(14px,2.2vw,30px);border-radius:26px;
  background:linear-gradient(160deg,#24262b,#121317 60%,#0b0c0f);box-shadow:0 40px 100px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.6)}
.tv::after{content:"";position:absolute;right:28px;bottom:9px;width:6px;height:6px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b}
.scr{position:relative;aspect-ratio:var(--ar);border-radius:18px/22px;overflow:hidden;background:#000;
  box-shadow:inset 0 0 40px rgba(0,0,0,.9)}
.scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.15) contrast(1.08) blur(.3px)}
.scr::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.42) 0 1px,transparent 1px 3px),
             repeating-linear-gradient(to right,rgba(255,0,80,.06) 0 1px,rgba(0,255,140,.05) 1px 2px,rgba(40,120,255,.06) 2px 3px)}
.scr::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;
  background:radial-gradient(ellipse 85% 80% at 50% 50%,transparent 58%,rgba(0,0,0,.75) 100%),
             linear-gradient(130deg,rgba(255,255,255,.10),transparent 30%);animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.93}52%{opacity:1}}
.crt.on .scr .in{animation:poweron 1s cubic-bezier(.2,.8,.2,1) .15s both}
.scr .in{position:absolute;inset:0}
@keyframes poweron{0%{transform:scale(1,.004);filter:brightness(6)}35%{transform:scale(1,.004);filter:brightness(6)}
  60%{transform:scale(1,1.03);filter:brightness(2)}100%{transform:none;filter:none}}
.term{font:400 clamp(22px,2vw,30px)/1.15 var(--crt);color:#9ff7ff;text-shadow:0 0 6px rgba(62,234,255,.8),0 0 18px rgba(62,234,255,.35);max-width:380px}
.term .l{opacity:0;white-space:pre}
.crt.on .term .l{animation:typein .01s steps(1) both}
@keyframes typein{to{opacity:1}}
.term .hl{color:#fff;font-size:1.5em;line-height:1}
.term .p{color:var(--ink);font-family:var(--disp);font-size:clamp(16px,1.3vw,19px);line-height:1.45;text-shadow:none;white-space:normal;margin-top:16px}
.cur{display:inline-block;width:.55em;height:.9em;background:#9ff7ff;vertical-align:-.08em;animation:blink 1s steps(1) infinite;box-shadow:0 0 8px var(--cya)}
@keyframes blink{50%{opacity:0}}
@media (max-aspect-ratio:1/1){
  .crtb{flex-direction:column;gap:26px;justify-content:center;padding-bottom:96px}
  .tv{width:100%;padding:12px;border-radius:18px}
  .term{max-width:none;width:100%}
}

/* ================= CAM: CCTV feed ================= */
.camb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(30px,5vw,90px);padding:40px clamp(20px,5vw,80px) 86px}
.feed{position:relative;flex:none;height:min(64vh,620px);aspect-ratio:var(--ar);max-width:56vw;background:#000;outline:1px solid rgba(236,232,225,.18);outline-offset:8px}
.feed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.55) contrast(1.15) brightness(.9) sepia(.15) hue-rotate(150deg)}
.feed .ov{position:absolute;inset:0;pointer-events:none;font:400 clamp(13px,1.1vw,16px)/1 var(--crt);color:#e8fff4;text-shadow:0 0 4px rgba(0,0,0,.9);letter-spacing:.06em}
.feed .ov::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0 1px,transparent 1px 2px);mix-blend-mode:overlay}
.feed .tl{position:absolute;left:12px;top:12px}
.feed .tr{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:6px}
.feed .tr i{width:9px;height:9px;border-radius:50%;background:#ff3045;box-shadow:0 0 8px #ff3045;animation:blink 1.4s steps(1) infinite}
.feed .bl{position:absolute;left:12px;bottom:12px}
.feed .br{position:absolute;right:12px;bottom:12px}
.feed .cx{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border:1px solid rgba(232,255,244,.5);border-radius:50%}
.camb .col{max-width:440px}
@media (max-aspect-ratio:1/1){
  .camb{flex-direction:column;gap:30px;padding-bottom:96px}
  .feed{height:auto;width:100%;max-width:none}
  .camb .col{width:100%}
}

/* ================= PAN ================= */
.panw{position:absolute;inset:0;overflow:hidden;background:#000}
.panw img{position:absolute;left:0;top:0;height:100%;width:auto;max-width:none;filter:saturate(1.05)}
.pan.on .panw img{animation:pan 30s cubic-bezier(.4,0,.6,1) .4s both}
@keyframes pan{from{transform:translateX(0)}to{transform:translateX(calc(100vw - 100%))}}
.pan .panw::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(4,5,8,.88),transparent 50%)}
.pan .reticle{position:absolute;z-index:3;right:clamp(20px,5vw,70px);top:calc(56px + env(safe-area-inset-top));font:400 11px/1.7 var(--hud);letter-spacing:.2em;color:var(--dim);text-align:right;text-transform:uppercase}

/* ================= AR overlay ================= */
.arb{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:clamp(30px,5vw,80px);padding:34px clamp(24px,6vw,110px) 76px}
.arf{position:relative;flex:none;height:min(86vh,980px);aspect-ratio:var(--ar);max-width:52vw;order:2}
.arf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.arf .grid{position:absolute;inset:0;pointer-events:none;opacity:.0;transition:opacity 2s 1s;
  background:linear-gradient(rgba(62,234,255,.10) 1px,transparent 1px) 0 0/100% 8.33%,linear-gradient(90deg,rgba(62,234,255,.10) 1px,transparent 1px) 0 0/8.33% 100%}
.ar.on .arf .grid{opacity:.55}
.box{position:absolute;opacity:0;transform:scale(1.25);transition:opacity .5s,transform .7s var(--ease)}
.box.lit{opacity:1;transform:none}
.box b{position:absolute;width:14px;height:14px;border:2px solid var(--cya);filter:drop-shadow(0 0 4px var(--cya))}
.box b:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.box b:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.box b:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.box b:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.box .lab{position:absolute;white-space:nowrap;font:400 11px/1.35 var(--hud);letter-spacing:.14em;text-transform:uppercase;color:#eafdff;
  background:rgba(4,8,12,.72);border-left:2px solid var(--cya);padding:5px 8px 5px 8px}
.box .lab em{display:block;font-style:normal;color:var(--cya);opacity:.8;font-size:10px}
.box.L .lab{right:calc(100% + 10px);top:0;text-align:right;border-left:0;border-right:2px solid var(--cya)}
.box.R .lab{left:calc(100% + 10px);top:0}
.box.B .lab{left:0;top:calc(100% + 8px)}
.box.m b{border-color:var(--mag);filter:drop-shadow(0 0 4px var(--mag))}
.box.m .lab{border-color:var(--mag)}.box.m .lab em{color:var(--mag)}
.arb .col{max-width:460px;order:1}
.arb .h{color:#fff}
@media (max-aspect-ratio:1/1){
  .arb{flex-direction:column;justify-content:flex-start;gap:20px;padding:54px 16px 86px}
  .arf{order:1;height:auto;width:100%;max-width:none;max-height:58vh;aspect-ratio:var(--ar)}
  .arf{width:min(100%,calc(58vh * var(--ar)))}
  .arb .col{order:2;width:100%;padding:0 4px}
  .box .lab,.box.L .lab,.box.R .lab{left:0;right:auto;top:calc(100% + 4px);text-align:left;border-right:0;border-left:2px solid var(--cya);font-size:9px;padding:3px 6px}
  .box.m .lab{border-left-color:var(--mag)}
  .box.B .lab{left:auto;right:0}
  .box.up .lab{top:auto;bottom:6px;left:6px}
  .box .lab em{display:none}
}

/* ================= PAIR ================= */
.pairw{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#000}
.pairw figure{position:relative;overflow:hidden}
.pairw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.05);transition:transform 14s cubic-bezier(.2,.5,.3,1)}
.pair.on .pairw img{transform:none}
.pairw figcaption{position:absolute;top:calc(54px + env(safe-area-inset-top));font:400 11px/1.6 var(--hud);letter-spacing:.2em;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px #000}
.pairw figure:first-child figcaption{left:clamp(20px,5vw,60px)}
.pairw figure:last-child figcaption{right:clamp(20px,5vw,60px);text-align:right}
.pairw figcaption span{display:block;color:var(--dim)}
.pair .shade{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to top,rgba(4,5,8,.92) 0%,rgba(4,5,8,.5) 30%,transparent 55%)}
.pair .txt{left:50%;transform:translateX(-50%);text-align:center;width:min(720px,90vw);max-width:none}
.pair .v{margin-left:auto;margin-right:auto}
@media (max-aspect-ratio:1/1){
  .pairw{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .pairw figure:last-child figcaption{top:12px}
  .pair .txt{left:20px;right:20px;transform:none;width:auto;text-align:left}
}

/* ================= GRID: six feeds ================= */
.gridb{position:absolute;inset:0;display:flex;align-items:center;gap:clamp(30px,4vw,70px);padding:50px clamp(20px,5vw,80px) 84px}
.feeds{flex:1;height:min(80vh,820px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:8px;order:2}
.cell{position:relative;overflow:hidden;background:#06080b;outline:1px solid rgba(236,232,225,.14)}

/* ---------------- loading ---------------- */
function load(i){
  const b=BEATS[i]; if(!b) return Promise.resolve();
  if(b.ready) return b.ready;
  b.ready=Promise.all(b.imgs_.map(im=>new Promise(res=>{
    if(im.src) return res();
    im.onload=()=>{(im.decode?im.decode():Promise.resolve()).catch(()=>{}).then(res)}; im.onerror=res; im.src=im.dataset.src;
  })));
  return b.ready;
}

/* ---------------- fogged glass (cityscapes only) ---------------- */
const G={b:null,cv:null,ctx:null,fog:null,mask:null,mctx:null,w:0,h:0,k:.5,t0:0,beads:[],runners:[],raf:0,lastSpawn:0};
function coverDraw(ctx,src,W,H,pos){
  const iw=src.naturalWidth||src.width, ih=src.naturalHeight||src.height; if(!iw||!ih) return;
  const p=(pos||'50% 50%').split(' ').map(v=>parseFloat(v)/100);
  const s=Math.max(W/iw,H/ih), dw=iw*s, dh=ih*s;
  ctx.drawImage(src,(W-dw)*p[0],(H-dh)*p[1],dw,dh);
}
function setupGlass(b){
  stopGlass();
  const cv=b.glass; const r=cv.getBoundingClientRect(); if(r.width<4) return;
  const k=Math.min(1,(window.devicePixelRatio||1)*.55);
  const w=Math.round(r.width*k), h=Math.round(r.height*k); cv.width=w; cv.height=h;
  const src=b.imgEl;
  const tiny=document.createElement('canvas'); tiny.width=Math.max(2,w/18|0); tiny.height=Math.max(2,h/18|0);
  const tctx=tiny.getContext('2d'); tctx.imageSmoothingQuality='high'; coverDraw(tctx,src,tiny.width,tiny.height,b.pos);
  const mid=document.createElement('canvas'); mid.width=Math.max(2,w/5|0); mid.height=Math.max(2,h/5|0);
  const m0=mid.getContext('2d'); m0.imageSmoothingQuality='high'; m0.drawImage(tiny,0,0,mid.width,mid.height);
  const fog=document.createElement('canvas'); fog.width=w; fog.height=h;
  const f=fog.getContext('2d'); f.imageSmoothingQuality='high'; f.drawImage(mid,0,0,w,h);
  f.fillStyle='rgba(8,10,16,.22)'; f.fillRect(0,0,w,h);
  const vg=f.createLinearGradient(0,0,0,h); vg.addColorStop(0,'rgba(178,192,206,.30)'); vg.addColorStop(1,'rgba(150,165,182,.18)');
  f.fillStyle=vg; f.fillRect(0,0,w,h);
  for(let i=0,n=w*h/14;i<n;i++){ f.fillStyle='rgba(225,235,245,'+(.05+Math.random()*.12)+')'; f.fillRect(Math.random()*w,Math.random()*h,1,1); }
  const mask=document.createElement('canvas'); mask.width=w; mask.height=h;
  const mc=mask.getContext('2d'); mc.fillStyle='#000'; mc.fillRect(0,0,w,h);
  Object.assign(G,{b,cv,ctx:cv.getContext('2d'),fog,mask,mctx:mc,w,h,k,t0:performance.now(),beads:[],runners:[],lastSpawn:0});
  const n=Math.round(w*h/1700); for(let i=0;i<n;i++) G.beads.push(bead());
  G.raf=requestAnimationFrame(tick);
}
function bead(y){return {x:Math.random()*G.w,y:y==null?Math.random()*G.h:y,r:(.5+Math.random()*Math.random()*2.4)*G.k*1.8}}
function stopGlass(){cancelAnimationFrame(G.raf);G.raf=0;G.b=null}
function tick(now){
  if(!G.b) return;
  const {ctx,w,h,mctx}=G; const t=(now-G.t0)/1000;
  const level=.36+.64*Math.exp(-t/3.2);
  mctx.globalCompositeOperation='source-over'; mctx.globalAlpha=.0045; mctx.fillStyle='#000'; mctx.fillRect(0,0,w,h); mctx.globalAlpha=1;
  if(!RM && now-G.lastSpawn>420+Math.random()*900 && G.runners.length<7){
    G.lastSpawn=now; G.runners.push({x:Math.random()*w,y:Math.random()*h*.6,r:(1.4+Math.random()*1.6)*G.k*1.8,v:0,a:.02+Math.random()*.05,wob:Math.random()*6});
  }
  mctx.globalCompositeOperation='destination-out';
  for(let i=G.runners.length-1;i>=0;i--){
    const d=G.runners[i]; const ox=d.x, oy=d.y;
    d.v=Math.min(d.v+d.a,2.6*G.k*1.6); d.y+=d.v*(.4+Math.random()); d.x+=Math.sin(d.y*.03+d.wob)*.12;
    mctx.lineWidth=d.r*2.2; mctx.lineCap='round'; mctx.strokeStyle='rgba(0,0,0,.5)';
    mctx.beginPath(); mctx.moveTo(ox,oy); mctx.lineTo(d.x,d.y); mctx.stroke();
    if(d.y>h+10) G.runners.splice(i,1);
  }
  mctx.globalCompositeOperation='source-over';
  ctx.globalCompositeOperation='source-over'; ctx.clearRect(0,0,w,h); ctx.globalAlpha=1;
  ctx.drawImage(G.fog,0,0);
  ctx.globalCompositeOperation='destination-in'; ctx.globalAlpha=level; ctx.drawImage(G.mask,0,0);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  for(const d of G.beads) drop(ctx,d.x,d.y,d.r,.8);
  for(const d of G.runners) drop(ctx,d.x,d.y,d.r,1);
  if(G.beads.length<w*h/1700 && Math.random()<.25) G.beads.push(bead());
  G.raf=requestAnimationFrame(tick);
}
function drop(ctx,x,y,r,a){
  const g=ctx.createRadialGradient(x-r*.3,y-r*.35,0,x,y,r);
  g.addColorStop(0,'rgba(255,255,255,'+(.55*a)+')'); g.addColorStop(.45,'rgba(200,215,230,'+(.12*a)+')'); g.addColorStop(1,'rgba(0,0,0,'+(.35*a)+')');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
}
let lastW=null;
function wipeAt(cx,cy,force){
  if(!G.b) return;
  const r=G.cv.getBoundingClientRect(); if(!r.width) return;
  const x=(cx-r.left)/r.width*G.w, y=(cy-r.top)/r.height*G.h;
  if(x<-40||y<-40||x>G.w+40||y>G.h+40){lastW=null;return}
  const R=Math.max(22,Math.min(G.w,G.h)*.09)*(force||1);
  const from=lastW||{x,y}; const dist=Math.hypot(x-from.x,y-from.y); const steps=Math.max(1,Math.ceil(dist/(R*.3)));
  const m=G.mctx; m.globalCompositeOperation='destination-out';
  for(let s=1;s<=steps;s++){
    const px=from.x+(x-from.x)*s/steps, py=from.y+(y-from.y)*s/steps;
    const g=m.createRadialGradient(px,py,0,px,py,R); g.addColorStop(0,'rgba(0,0,0,.55)'); g.addColorStop(.6,'rgba(0,0,0,.35)'); g.addColorStop(1,'rgba(0,0,0,0)');
    m.fillStyle=g; m.beginPath(); m.arc(px,py,R,0,7); m.fill();
  }
  m.globalCompositeOperation='source-over';
  G.beads=G.beads.filter(d=>Math.hypot(d.x-x,d.y-y)>R*.8);
  lastW={x,y};
  Sound.wipe(Math.min(1,dist/(R*1.2)));
}

  const ctx=cv.getContext('2d'); RainFX.cv=cv; RainFX.drops=[];
  for(let i=0;i<90;i++) RainFX.drops.push({x:Math.random()*cv.width,y:Math.random()*cv.height,l:6+Math.random()*14,v:4+Math.random()*5});
  (function f(){ ctx.clearRect(0,0,cv.width,cv.height); ctx.strokeStyle='rgba(180,200,230,.22)'; ctx.lineWidth=1; ctx.beginPath();
    for(const d of RainFX.drops){ d.y+=d.v; d.x-=d.v*.12; if(d.y>cv.height){d.y=-d.l;d.x=Math.random()*cv.width*1.1} ctx.moveTo(d.x,d.y); ctx.lineTo(d.x+d.l*.12,d.y-d.l); }
    ctx.stroke(); RainFX.raf=requestAnimationFrame(f); })();
}
function stopRain(){cancelAnimationFrame(RainFX.raf)}

/* ---------------- decrypt ---------------- */
const Dec={raf:0};
function startDecrypt(b){
  stopDecrypt();
  const cv=b.el.querySelector('.decf canvas'), img=b.imgEl, pct=b.el.querySelector('.pct'), h=b.el.querySelector('.dect .h');
  const r=cv.getBoundingClientRect(); const W=cv.width=Math.max(2,r.width|0), H=cv.height=Math.max(2,r.height|0);
  const ctx=cv.getContext('2d'); const off=document.createElement('canvas'); const oc=off.getContext('2d');
  const fin=h.dataset.final, glyphs='01#%$&@<>/\\|=+*アカサタナ電脳';
  const T=RM?.01:3600, t0=performance.now();
  (function f(now){
    const p=Math.min(1,(now-t0)/T), e=1-Math.pow(1-p,2.2);
    const bs=Math.max(1,Math.round(64*(1-e)+1)); // block size
    const sw=Math.max(1,Math.ceil(W/bs)), sh=Math.max(1,Math.ceil(H/bs));
    off.width=sw; off.height=sh; oc.imageSmoothingEnabled=true; coverDraw(oc,img,sw,sh,'50% 50%');
    ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,W,H); ctx.drawImage(off,0,0,sw,sh,0,0,sw*bs,sh*bs);
    if(p<1){ ctx.fillStyle='rgba(62,234,255,'+(.08*(1-p))+')'; ctx.fillRect(0,0,W,H); }
    pct.textContent=(p<1?Math.floor(e*100)+'%':'100% — OPEN');
    let s=''; for(let i=0;i<fin.length;i++){ s+= fin[i]===' '?' ': (i/fin.length<e*1.05? fin[i] : glyphs[(Math.random()*glyphs.length)|0]); }
    h.textContent=s;
    if(p<1){ Dec.raf=requestAnimationFrame(f); if(Math.random()<.25) Sound.tick(); } else h.textContent=fin;
  })(t0);
}
function stopDecrypt(){cancelAnimationFrame(Dec.raf)}

/* ---------------- sound ---------------- */
const Sound=(()=>{
  let ac=null,master=null,on=true,wipeG=null,beds=[],chap=0;
  try{on=localStorage.getItem('cp-sound')!=='off'}catch(e){}
  function noiseBuf(sec){const b=ac.createBuffer(1,ac.sampleRate*sec,ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
  function src(buf,rate){const s=ac.createBufferSource();s.buffer=buf;s.loop=true;if(rate)s.playbackRate.value=rate;s.start();return s}
  function filt(type,f,q){const x=ac.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;return x}
  function gain(v){const g=ac.createGain();g.gain.value=v;return g}
  function start(){
    if(ac) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ac=new AC(); master=gain(0); master.connect(ac.destination);
    const nb=noiseBuf(4);
    // bed 0 & 4: rain + far neon hum
    const rain=gain(0); rain.connect(master);
    src(nb).connect(filt('lowpass',900,.3)).connect(gain(.11)).connect(rain);
    src(nb,.93).connect(filt('highpass',4500)).connect(gain(.018)).connect(rain);
    const hum=gain(.012); hum.connect(rain);
    [[60,'sine',1],[120,'sawtooth',.25],[180,'sine',.2]].forEach(([f,t,a])=>{const o=ac.createOscillator();o.type=t;o.frequency.value=f;o.connect(filt('lowpass',420)).connect(gain(a)).connect(hum);o.start()});
    // bed 1: clinic room tone — ventilation
    const clinic=gain(0); clinic.connect(master);
    src(nb,.5).connect(filt('bandpass',180,.7)).connect(gain(.22)).connect(clinic);
    src(nb,.8).connect(filt('bandpass',2400,4)).connect(gain(.006)).connect(clinic);
    const fo=ac.createOscillator(); fo.frequency.value=50; fo.connect(filt('lowpass',120)).connect(gain(.012)).connect(clinic); fo.start();
    // bed 2: street murmur + a slow drum-machine pulse (pulse is scheduled below)
    const street=gain(0); street.connect(master);
    const mur=gain(.13); src(nb,.7).connect(filt('bandpass',520,.9)).connect(mur).connect(street);
    const ml=ac.createOscillator(); ml.frequency.value=.31; const mlg=gain(.05); ml.connect(mlg).connect(mur.gain); ml.start();
    src(nb,.9).connect(filt('lowpass',300)).connect(gain(.05)).connect(street);
    // bed 3: data drone
    const net=gain(0); net.connect(master);
    [55,55.4,82.6].forEach((f,k)=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(filt('lowpass',260+k*40,2)).connect(gain(.018)).connect(net);o.start()});
    const lf=ac.createOscillator(); lf.frequency.value=.05; const lfg=gain(.008); lf.connect(lfg).connect(net.gain); lf.start();
    beds=[rain,clinic,street,net,rain];
    // squeak for wiping glass
    wipeG=gain(0); src(nb).connect(filt('bandpass',2300,6)).connect(wipeG).connect(master);
    // periodic textures per chapter
    (function loop(){ if(!ac) return; setTimeout(loop,120);
      if(!on||ac.state!=='running') return; const t=ac.currentTime;
      if((chap===0||chap===4) && Math.random()<.18) blip(1400+Math.random()*2600,.06,.006+Math.random()*.01,'sine',1.7);
      if(chap===1 && t-(loop.bp||0)>1.15){ loop.bp=t; blip(988,.09,.006,'sine',1); }
      if(chap===2 && t-(loop.kk||0)>.66){ loop.kk=t; kick(t); }
      if(chap===3 && Math.random()<.12) blip(2000+Math.random()*3000,.02,.005,'square',1);
    })();
    setChap(chap,true); apply();
  }
  function blip(f,dur,v,type,glide){const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(glide!==1)o.frequency.exponentialRampToValueAtTime(f*glide,t+dur*.7);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02)}
  function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.32);
    o.connect(filt('lowpass',200)).connect(g).connect(master);o.start(t);o.stop(t+.35)}
  function setChap(c,now){ chap=c; if(!ac) return; const t=ac.currentTime;
    const lv=[1,.9,.9,1,.75];
    beds.forEach((g,k)=>{ if(k===4) return; const target=(k===c||(c===4&&k===0))?lv[c]:0; g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(target,t,now?.05:1.4); }); }
  function apply(){ if(!ac) return; master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(on?.9:0,ac.currentTime,.4); }
  function ok(){return ac&&on&&ac.state==='running'}
  function buzz(delay,small){
    if(!ok()) return; const t0=ac.currentTime+(delay||0);
    (small?[0,.06,.23]:[0,.12,.17,.34,.47,.5]).forEach((d,i)=>{
      const t=t0+d, o=ac.createOscillator(), g=ac.createGain(), f=filt('bandpass',900+i*130,1.2);
      o.type='square'; o.frequency.value=120;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.02,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.07);
      o.connect(f).connect(g).connect(master); o.start(t); o.stop(t+.09);
    });
  }
  function glitch(){ if(!ok()) return; const t=ac.currentTime;
    for(let i=0;i<7;i++){ const s=ac.createBufferSource(); const b=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate); const d=b.getChannelData(0);
      const step=4+(Math.random()*30|0); let v=0; for(let j=0;j<d.length;j++){ if(j%step===0) v=Math.random()*2-1; d[j]=v; }
      s.buffer=b; const g=gain(.035); s.connect(filt('bandpass',400+Math.random()*3000,1)).connect(g).connect(master); s.start(t+i*.07+Math.random()*.03); } }
  function crt(){ if(!ok()) return; const t=ac.currentTime+.12;
    const o=ac.createOscillator(); o.frequency.value=15600; const g=gain(0); o.connect(g).connect(master);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.006,t+.2); g.gain.exponentialRampToValueAtTime(.0001,t+2.2); o.start(t); o.stop(t+2.3);
    const s=ac.createBufferSource(); s.buffer=noiseBuf(.3); const g2=gain(0); s.connect(filt('lowpass',600)).connect(g2).connect(master);
    g2.gain.setValueAtTime(.12,t); g2.gain.exponentialRampToValueAtTime(.0001,t+.25); s.start(t); }
  function sweep(){ if(!ok()) return; const t=ac.currentTime; const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(2400,t+1); const g=gain(0); o.connect(g).connect(master);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.012,t+.1); g.gain.linearRampToValueAtTime(0,t+1.1); o.start(t); o.stop(t+1.2); }
  function cam(){ if(!ok()) return; blip(1760,.07,.012,'square',1); }
  function tick(){ if(!ok()) return; blip(3000+Math.random()*2000,.015,.006,'square',1); }
  function wipe(v){ if(!ac||!wipeG) return; const t=ac.currentTime; wipeG.gain.cancelScheduledValues(t);
    wipeG.gain.setTargetAtTime(.05*v,t,.02); wipeG.gain.setTargetAtTime(0,t+.06,.08); }
  return {start,buzz,glitch,crt,sweep,cam,tick,wipe,setChap,
    resume(){ if(ac&&ac.state==='suspended') ac.resume(); },
    toggle(){ on=!on; try{localStorage.setItem('cp-sound',on?'on':'off')}catch(e){} apply(); return on; },
    get on(){return on}};
})();
const sndBtn=document.getElementById('snd');
if(!Sound.on) sndBtn.classList.add('off');
[sndBtn,backBtn,dmark].forEach(b=>b.addEventListener('pointerdown',e=>e.stopPropagation()));
sndBtn.addEventListener('click',e=>{e.stopPropagation(); Sound.start(); Sound.resume(); sndBtn.classList.toggle('off',!Sound.toggle());});
backBtn.addEventListener('click',e=>{e.stopPropagation(); first(); back();});
dmark.addEventListener('click',e=>{e.stopPropagation(); first(); openDepth();});

/* ---------------- glitch overlay ---------------- */
const glitchEl=document.getElementById('glitch'), scanEl=document.getElementById('scanline');
function fireGlitch(){
  let h=''; for(let i=0;i<9;i++){ const top=Math.random()*100, ht=1+Math.random()*7, c=['rgba(255,47,126,.5)','rgba(62,234,255,.5)','rgba(255,255,255,.35)'][i%3];
    h+='<i style="top:'+top+'%;height:'+ht+'%;background:'+c+';transform:translateX('+(Math.random()*60-30)+'px)"></i>'; }
  glitchEl.innerHTML=h; glitchEl.classList.remove('go'); void glitchEl.offsetWidth; glitchEl.classList.add('go');
}
function fireScan(){ scanEl.classList.remove('go'); void scanEl.offsetWidth; scanEl.classList.add('go'); }

/* ---------------- depth layer ---------------- */
let depthOpen=false;
function openDepth(){
  const b=BEATS[cur]; if(!b||!b.d||depthOpen) return false;
  depth.querySelector('.in').innerHTML='<div class="q"><span>&#9650; Data // '+esc(b.d.q)+'</span><span>&darr; / Esc close</span></div><ul>'+
    b.d.l.map((l,k)=>'<li style="transition-delay:'+(.15+k*.12)+'s">'+esc(l)+'</li>').join('')+'</ul>'+
    (b.d.a?'<div class="links">'+b.d.a.map(a=>'<a href="'+a[1]+'" target="_blank" rel="noopener">'+esc(a[0])+' &#8599;</a>').join('')+'</div>':'');
  depthOpen=true; depth.classList.add('open'); scrim.classList.add('open'); dmark.classList.remove('show'); Sound.tick(); return true;
}
function closeDepth(){ if(!depthOpen) return false; depthOpen=false; depth.classList.remove('open'); scrim.classList.remove('open'); syncMark(); return true; }
function syncMark(){ const b=BEATS[cur]; dmark.classList.toggle('show',!!(b&&b.d)&&!depthOpen); }
depth.addEventListener('pointerdown',e=>e.stopPropagation());
scrim.addEventListener('pointerdown',e=>{e.stopPropagation(); closeDepth();});

/* ---------------- sequence ---------------- */
let cur=-1, started=false, timers=[];
const clockTimer=setInterval(()=>{ const b=BEATS[cur]; if(!b||b.t!=='cam') return; const c=b.el.querySelector('.clock');
  const d=new Date(); c.textContent='1989-11-25  '+pad(2+(d.getMinutes()%2))+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); },500);
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function go(i,dir){
  i=Math.max(0,Math.min(N-1,i)); if(i===cur) return;
  closeDepth(); clearTimers(); stopGlass(); stopRain(); stopDecrypt(); lastW=null;
  const prev=BEATS[cur]; const b=BEATS[i];
  const tr=(dir<0)?'fade':b.tr;
  b.el.classList.remove('t-fade','t-cut','t-hold','t-glitch','t-scan'); b.el.classList.add('t-'+tr);
  if(prev){ prev.el.classList.remove('on'); if(tr==='cut'||tr==='glitch'||tr==='scan'){ prev.el.style.transition='none'; requestAnimationFrame(()=>prev.el.style.transition=''); } }
  cur=i; try{parent!==window&&parent.postMessage({aw:'beat',i:cur,n:N},'*')}catch(e){}
  // reset per-beat states
  b.el.querySelectorAll('.box').forEach(x=>x.classList.remove('lit'));
  b.el.querySelectorAll('.cell').forEach(x=>x.classList.remove('lit'));
  b.el.querySelectorAll('.h,.kj,.l,.scr .in,.panw img').forEach(x=>{x.style.animation='none'; void x.offsetWidth; x.style.animation='';});
  b.el.classList.add('on');
  if(tr==='glitch'){ fireGlitch(); Sound.glitch(); }
  if(tr==='scan'){ fireScan(); Sound.sweep(); }
  slugEl.style.opacity=0; setTimeout(()=>{slugEl.textContent=b.slug; slugEl.style.opacity=1},300);
  countEl.textContent=pad(i+1)+' / '+N;
  backBtn.classList.toggle('off',i===0);
  if(i>0) hint.classList.add('gone');
  syncMark(); dmark.classList.remove('ping'); if(b.d){ void dmark.offsetWidth; dmark.classList.add('ping'); }
  Sound.setChap(b.ch);
  const ready=load(i);
  ready.then(()=>{ if(cur!==i) return;
    if(b.t==='fog') requestAnimationFrame(()=>{ if(cur===i) setupGlass(b) });
    if(b.t==='dec') timers.push(setTimeout(()=>{ if(cur===i) startDecrypt(b) },RM?0:400));
    if(b.t==='ar') b.el.querySelectorAll('.box').forEach((x,k)=>timers.push(setTimeout(()=>{x.classList.add('lit'); Sound.cam();},(RM?0:1300)+k*(RM?0:1100))));
    if(b.t==='grid') b.el.querySelectorAll('.cell').forEach((x,k)=>timers.push(setTimeout(()=>{x.classList.add('lit'); Sound.cam();},(RM?0:250)+k*(RM?0:480))));
  });
  if(b.t==='dec'){ const cv=b.el.querySelector('.decf canvas'); const c=cv.getContext('2d'); c.fillStyle='#000'; c.fillRect(0,0,cv.width,cv.height); }
  if(b.t==='sign') startRain(b.el.querySelector('canvas.rain'));
  if(b.t==='crt') Sound.crt();
  if(b.t==='cam') Sound.cam();
  if(b.el.classList.contains('neon')||b.t==='sign') Sound.buzz(RM?0:.45);
  load(i+1); load(i+2);
}
function next(){ go(cur+1,1) } function back(){ go(cur-1,-1) }
function first(){ if(started) return; started=true; Sound.start(); Sound.resume(); }

setInterval(()=>{ if(RM||depthOpen) return; const b=BEATS[cur]; if(!b) return; const h=b.el.querySelector('.neon .h,.neon.h,.kj'); if(!h||Math.random()>.35) return;
  if(h.animate) h.animate([{filter:'none'},{filter:'brightness(.35)',offset:.12},{filter:'none',offset:.2},{filter:'brightness(.6)',offset:.46},{filter:'none',offset:.52},{filter:'none'}],{duration:500,easing:'steps(1,end)'});
  if(Math.random()<.6) Sound.buzz(0,1); },5600);

/* ---------------- input ---------------- */
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='Escape'){ closeDepth(); return; }
  if(k==='ArrowUp'||k==='PageUp'){ e.preventDefault(); first(); openDepth(); return; }
  if(k==='ArrowDown'){ e.preventDefault(); first(); if(!closeDepth()) next(); return; }
  if(depthOpen && (k===' '||k==='Enter')){ e.preventDefault(); closeDepth(); return; }
  if(['ArrowRight',' ','PageDown','Enter'].includes(k)){ e.preventDefault(); first(); closeDepth(); next(); }
  else if(k==='ArrowLeft'){ e.preventDefault(); first(); closeDepth(); back(); }
});
let P=null;
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('a')) return;
  e.preventDefault();
  first();
  P={id:e.pointerId,x:e.clientX,y:e.clientY,type:e.pointerType,wipe:false,moved:0};
  lastW=null;
  if(e.pointerType!=='mouse' && G.b){ P.timer=setTimeout(()=>{ if(P&&P.moved<12){P.wipe=true; wipeAt(P.x,P.y,1)} },260); }
});
document.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){
    if(P) P.moved=Math.max(P.moved,Math.hypot(e.clientX-P.x,e.clientY-P.y));
    if(G.b && !depthOpen) wipeAt(e.clientX,e.clientY,P?1.25:1);
    return;
  }
  if(!P||e.pointerId!==P.id) return;
  P.moved=Math.max(P.moved,Math.hypot(e.clientX-P.x,e.clientY-P.y));
  if(P.wipe) wipeAt(e.clientX,e.clientY,1.15);
  else if(P.moved>=12) clearTimeout(P.timer);
});
function up(e){
  if(!P||e.pointerId!==P.id) return;
  clearTimeout(P.timer);
  const dx=e.clientX-P.x, dy=e.clientY-P.y;
  if(!P.wipe){
    if(depthOpen){ if(dy>40||Math.hypot(dx,dy)<12) closeDepth(); }
    else if(P.type==='mouse'){ if(P.moved<8 && e.button===0) next(); }
    else if(Math.hypot(dx,dy)>45){
      if(Math.abs(dx)>Math.abs(dy)) (dx<0?next:back)();
      else if(dy<0){ if(!openDepth()) next(); }
      else back();
    }
    else if(P.moved<12) next();
  }
  P=null; lastW=null;
}
document.addEventListener('pointerup',up);
document.addEventListener('pointercancel',()=>{ if(P){clearTimeout(P.timer);P=null} });
document.addEventListener('mouseleave',()=>{lastW=null});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

let rt; addEventListener('resize',()=>{clearTimeout(rt); rt=setTimeout(()=>{const b=BEATS[cur]; if(!b) return;
  if(b.t==='fog') setupGlass(b); if(b.t==='sign') startRain(b.el.querySelector('canvas.rain')); if(b.t==='dec') startDecrypt(b);},200)});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) cancelAnimationFrame(G.raf); else if(G.b) G.raf=requestAnimationFrame(tick); });

go(0);
window.__cp={go:i=>go(i,1),openDepth,closeDepth,get cur(){return cur}};
})();
</script>
<script>addEventListener('load',()=>{setTimeout(()=>{try{parent!==window&&parent.postMessage({aw:'beat',i:0,n:document.querySelectorAll('.beat').length||0,init:1},'*')}catch(e){}},300)})</script></body>
