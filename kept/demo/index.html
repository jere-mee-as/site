*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.frame{height:100%;display:grid;grid-template-rows:56px minmax(0,1fr) 32px}
header{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;align-items:center;border-bottom:1px solid var(--line)}
.brand{padding:0 24px;display:flex;align-items:baseline;gap:8px}
.brand b{font:600 13px/1 var(--mono);letter-spacing:.14em}

.q{margin:0 24px;height:36px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 12px;min-width:0}

.q svg{flex:none}
.q input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:13px}
.q .tr{font:11px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.q .tr kbd{font:inherit;border:1px solid var(--line);border-radius:var(--r);padding:0 4px;margin-left:6px}
.counts{padding:0 24px;display:flex;justify-content:flex-end;gap:16px;font:11px var(--mono);color:var(--dim)}
main{display:grid;grid-template-columns:220px minmax(0,1fr) 360px;min-height:0}
nav{border-right:1px solid var(--line);padding:16px 0;display:flex;flex-direction:column;gap:22px;min-height:0;overflow:hidden}
.views{display:flex;flex-direction:column}
.view{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 24px 0 21px;border-left:3px solid transparent;text-align:left}
.view:hover{background:var(--sel)}
.view.on{border-color:var(--acc);background:var(--sel);font-weight:600}
.view i{font:normal 11px var(--mono);color:var(--dim)}
.lbl{font:10.5px var(--mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.props{padding:0 24px;display:flex;flex-direction:column;gap:10px}
.prop{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.prop b{font-weight:500}
.prop span{font-size:11.5px;color:var(--dim)}
.prop .row{display:flex;gap:8px}
.btn{border-radius:var(--r);font-size:11.5px;padding:4px 10px;border:1px solid var(--line)}
.btn:hover{background:var(--sel)}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.watched{margin-top:auto;padding:0 24px;display:flex;flex-direction:column;gap:6px;font:11px var(--mono);color:var(--dim)}
.watched button{text-align:left}.watched button:hover{color:var(--ink)}

.rh .meta{font:11px var(--mono);color:var(--dim);white-space:nowrap;display:flex;gap:12px;align-items:center}

.it.on{border-left-color:var(--acc);background:var(--sel)}

.it .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .mt{font:11px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .gs{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.th{width:48px;height:48px;border-radius:var(--r);overflow:hidden;position:relative;background:var(--t1)}
.th canvas,.pv canvas{width:100%;height:100%;display:block}
.th span{position:absolute;left:4px;bottom:3px;font:9px var(--mono);color:#fff;mix-blend-mode:difference}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:18px 24px;align-content:start;align-items:start}
.grid .it{display:flex;flex-direction:column;gap:6px;padding:0;border:0;border-bottom:3px solid transparent;align-items:stretch}
.grid .it.on{border-bottom-color:var(--acc);background:none}
.grid .th{width:100%;height:auto;aspect-ratio:1}
.grid .it .nm{font-size:12px}

.grid .mh{grid-column:1/-1;padding:4px 0}
.empty{padding:40px 24px;color:var(--dim)}
.empty b{display:block;font-size:22px;color:var(--ink);font-weight:500;margin-bottom:6px}
aside{display:flex;flex-direction:column;min-height:0;overflow:auto;scrollbar-width:thin}
.pv{aspect-ratio:4/3;background:var(--t1);position:relative;border-bottom:1px solid var(--line);flex:none}
.pv .sz{position:absolute;right:10px;bottom:8px;font:10.5px var(--mono);color:#fff;mix-blend-mode:difference}
.sec{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.fn{font-size:18px;font-weight:500;letter-spacing:-.01em;word-break:break-word;margin:0}
.path{font:11px var(--mono);color:var(--dim);display:flex;flex-wrap:wrap;gap:2px}

footer{border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;font:11px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden}

footer .demo{margin-left:auto;color:var(--ink)}

#full canvas{max-width:86vw;max-height:80vh}
#full p{position:absolute;left:24px;bottom:16px;color:#ddd;font:12px var(--mono);margin:0}
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:12px var(--mono);padding:8px 12px;border-radius:var(--r);display:none;z-index:10}
#toast.on{display:block}
.mob{display:none}

  main{grid-template-columns:minmax(0,1fr)}
  nav{position:fixed;left:0;top:56px;bottom:32px;width:240px;background:var(--bg);z-index:5;transform:translateX(-100%)}
  body.navon nav{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  aside{position:fixed;inset:56px 0 32px;background:var(--bg);z-index:6;display:none}
  body.paneon aside{display:flex}
  .mob{display:inline-flex}
  .rh{padding:0 14px}.it{padding:12px 14px 12px 11px}
  footer .keys{display:none}
  .q .tr{display:none}
}
</style>

function translate(q){if(/\w:/.test(q))return'';const w=q.toLowerCase().replace(/[^\w\s-]/g,' ').split(/\s+/).filter(Boolean);if(w.length<2)return'';const out=[];const rest=[];
  w.forEach((x,i)=>{if(SYN[x]){if(SYN[x]==='receipt')out.push('tag:receipt');else out.push('kind:'+SYN[x])}else if(MONTHS[x])out.push('when:'+new Date().getFullYear()+'-'+String(MONTHS[x]).padStart(2,'0'));else if(x==='yesterday'||x==='today')out.push('when:'+x);else if(x==='week'&&w[i-1]==='this')out.push('when:7d');else if(x==='month'&&w[i-1]==='this')out.push('when:30d');else if(['lisbon','shenandoah','home'].includes(x))out.push('at:'+x);else if(!FILLER.has(x)&&!['week','month'].includes(x))rest.push(x)});

let likeOf=null;
function run(q){const t=parse(q);let exact=0,mean=0;const res=[];
  for(const f of FILES){let ok=true;
    if(t.is)for(const v of t.is){if(v==='new'&&!f.new)ok=false;if(v==='guess'&&!(f.new||f.conf.size<4))ok=false;if(v==='confirmed'&&(f.new||f.conf.size<4))ok=false}
    if(t.kind&&!t.kind.some(k=>f.kind===k||(k==='image'&&f.kind==='screenshot')))ok=false;
    if(t.in&&!t.in.some(v=>f.folder.toLowerCase().startsWith(v)))ok=false;
    if(t.when&&!t.when.every(v=>matchWhen(f,v)))ok=false;
    if(t.tag&&!t.tag.every(v=>f.tags.includes(v)))ok=false;
    if(t.group&&!t.group.some(v=>f.group.toLowerCase()===v))ok=false;
    if(t.at&&!t.at.some(v=>f.place.toLowerCase().includes(v)))ok=false;
    if(t.ext&&!t.ext.some(v=>f.name.toLowerCase().endsWith('.'+v)))ok=false;
    if(t.name&&!t.name.every(v=>f.name.toLowerCase().includes(v)))ok=false;
    if(t.like&&likeOf){const L=FILES[likeOf];if(f===L||!(f.group&&f.group===L.group||f.tags.some(x=>L.tags.includes(x))))ok=false}
    if(!ok)continue;

    let how='exact';

  return{res,exact,mean,headers:!!t.sort}}

  else if(grid&&k==='ArrowRight')selectK(sel+1);else if(grid&&k==='ArrowLeft')selectK(sel-1);

  else if(k==='Enter'){const it=results[sel];it&&toast(`Opens ${it.f.name} in its own app (not in the demo)`)}
  else if(k==='a')accept();else if(k==='x')dismiss();else if(k==='l')like();
  else if(k==='v'){grid=!grid;list()}
  else if(k==='t')setSkin(SKINS[(SKINS.indexOf(skin)+1)%SKINS.length]);
  else if(k==='e')toast('Edit field: in the app this jumps into the first guess');
  else if(k==='g')toast('Add to a group: in the app this offers your groups');
  else if(/^[1-5]$/.test(k))setQ(VIEWS[+k-1].q);
  else if(k==='Escape'){if(document.body.classList.contains('paneon'))document.body.classList.remove('paneon');else if(query!=='is:new')setQ('is:new')}});
function colCount(){const it=document.querySelectorAll('#list .it');if(it.length<2)return 1;const top=it[0].offsetTop;let n=0;for(const b of it){if(b.offsetTop!==top)break;n++}return n||1}
$('#nfiles').textContent=FILES.length.toLocaleString()+' files';$('#ncards').textContent=FILES.filter(f=>!f.new).length+' cards';
qi.placeholder='Search, or a sentence: photos from lisbon in september';
document.body.dataset.skin=skin;setQ('is:new');
})();
