<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<link rel="canonical" href="{{url}}/">
<meta property="og:type" content="website">
<meta property="og:url" content="{{url}}/">
<meta property="og:title" content="{{name}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{name}}">
<meta name="description" content="{{description}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<!-- Built from template.html and site.json by build.py (tools/front_door.py). Edit those, not index.html. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap">
<style>
:root{
  --paper:#f2f0eb; --ink:#111111; --mute:#5d5a54; --rule:#d6d2c9;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Instrument Serif',Didot,Georgia,serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.mute{color:var(--mute)}

/* a single short fade for the whole page */
.page{max-width:1280px;margin:0 auto;padding:28px max(40px,env(safe-area-inset-right)) 72px max(40px,env(safe-area-inset-left));animation:in .45s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* top bar */
.bar{display:flex;justify-content:flex-end;align-items:baseline;flex-wrap:wrap;gap:10px 28px;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.bar nav{display:flex;gap:28px}
.bar nav a:hover,.u:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

main{display:flex;flex-wrap:wrap;gap:48px 56px;padding-top:48px}
.me{flex:0 1 440px;min-width:0;display:flex;flex-direction:column;gap:32px}
.index{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:34px}

/* photo + name: the name's capitals sit on the photo's bottom edge */
.id{display:flex;gap:24px;align-items:flex-end}
.pfp{width:148px;height:185px;flex:none;display:block}
.pfp img,.cover img{display:block;width:100%;height:100%;object-fit:cover}
.bw{filter:grayscale(1) contrast(1.06);transition:filter .9s var(--ease)}
.bw:hover,a:hover .bw,.bw.on{filter:none}
.nm{flex:1;min-width:0;container-type:inline-size;height:185px;display:flex;flex-direction:column;justify-content:space-between}
.reveal{position:relative;overflow:hidden}
.reveal p{position:absolute;left:0;margin:0;line-height:1.7;color:var(--mute);opacity:0;transition:transform .6s var(--ease),opacity .45s ease}
.reveal p b{font-weight:500;color:var(--ink)}
.top{height:58px}.top p{top:0;transform:translateY(-110%)}
.low{height:19px;margin-bottom:12px}.low p{bottom:0;white-space:nowrap;transform:translateY(110%)}
.id.f .facts,.id.s .say{transform:none;opacity:1}
.pfp{cursor:default}
.name{display:block;margin:0 -.28em -1px 0;padding:0;border:0;background:none;font:500 min(14cqi,52px)/.74 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--ink);text-align:left;white-space:nowrap;cursor:default}

.head{margin:0;max-width:440px;font:400 46px/1.04 var(--serif);letter-spacing:-.005em}
.head i{font-style:italic}

.new{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;align-items:center;padding-top:20px;border-top:1px solid var(--ink)}
.cover{width:120px;height:96px}
.cover img{object-position:50% 40%}
.new .t{font:400 26px/1.1 var(--serif)}
.new span{display:block}
.new .label{margin-bottom:5px}
.new .t+span{margin-top:5px}
.new:hover .t{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* the index */
.h{display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--ink);font-weight:500}
.row{display:grid;grid-template-columns:minmax(0,1fr) 84px 88px;gap:16px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule)}
.row b{font-weight:500}
.row .k{font-size:10.5px}
.row .d{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.w{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule)}
.w .t{font:400 21px/1.25 var(--serif)}
.w:hover .t{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.more{display:block;padding:11px 0}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.go{display:flex;justify-content:space-between;padding:11px 0}
.go:hover span:first-child{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;padding:11px 0}

/* phones */
@media (max-width:620px){
  body{font-size:13px}
  .page{padding:20px max(20px,env(safe-area-inset-right)) 48px max(20px,env(safe-area-inset-left))}
  .label{font-size:10.5px}
  .bar nav{gap:14px}
  main{padding-top:20px;gap:28px}
  .me{gap:18px}
  .index{gap:22px}
  .id{gap:16px}
  .pfp{width:84px;height:105px}
  .nm{height:105px}
  .top{height:52px}
  .low{height:18px;margin-bottom:8px}
  .name{font-size:min(14cqi,30px);cursor:pointer}
  .pfp{cursor:pointer}
  .head{max-width:224px;font-size:25px}
  .new{grid-template-columns:84px minmax(0,1fr);gap:14px;padding-top:14px}
  .cover{width:84px;height:66px}
  .new .t{font-size:21px}
  .new .sub{display:none}
  .h{padding-bottom:6px}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:7px 0}
  .row .s{display:block;font-size:12px}
  .row .k{display:none}
  .row .s .kk{display:inline}
  .row .d{font-size:12px}
  .w{padding:5px 0}
  .w .t{font-size:18px}
  .w .d{font-size:12px}
  .pair{grid-template-columns:1fr;gap:18px}
}
@media (min-width:621px){.row .s::before{content:" · ";white-space:pre}.row .s .kk{display:none}}
/* laptops: the role drops under the employer, like on phones, so rows never wrap mid-title */
@media (min-width:621px) and (max-width:1240px){.row{grid-template-columns:minmax(0,1fr) 88px;padding:9px 0}.row .k{display:none}.row .s{display:block;margin-top:1px}.row .s::before{content:none}.row .s .kk{display:inline}}

/* résumé: a panel that slides in from the right (from the bottom on phones) over a soft veil */
.rs-wrap{position:fixed;inset:0;z-index:20}
.rs-veil{position:absolute;inset:0;background:rgba(17,17,17,.28);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;transition:opacity .45s ease}
.rs-panel{position:absolute;top:0;right:0;bottom:0;width:min(640px,100%);overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-left:1px solid var(--ink);padding:28px 40px 56px;transform:translateX(100%);transition:transform .6s var(--ease);outline:none}
.rs-wrap.open .rs-veil{opacity:1}
.rs-wrap.open .rs-panel{transform:none}
.rs-panel>*{opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .6s var(--ease)}
.rs-wrap.open .rs-panel>*{opacity:1;transform:none;transition-delay:calc(.18s + var(--k,0) * .04s)}
body.locked{overflow:hidden}
.rs-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.rs-act{display:flex;gap:22px;align-items:baseline}
.rs-x{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink);cursor:pointer}
.rs-x:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.rs-head{padding-top:32px}
.rs-head h2{margin:0;font:400 40px/1.05 var(--serif)}
.rs-head p{margin:8px 0 0}
.rs-sum{margin:22px 0 0;font:400 21px/1.35 var(--serif)}
.rs-sec{margin-top:34px}
.rs-job{padding:14px 0;border-bottom:1px solid var(--rule)}
.rs-org{margin:0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rs-org b{font-weight:500}
.rs-role{margin:12px 0 4px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rs-role span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.rs-panel ul{margin:6px 0 0;padding:0 0 0 16px}
.rs-panel li{margin:5px 0;line-height:1.55}
.rs-panel li::marker{color:var(--mute)}
.rs-note{margin:4px 0 0}
.rs-skills{margin:0}
.rs-skills div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:11px 0;border-bottom:1px solid var(--rule)}
.rs-skills dt{padding-top:2px}
.rs-skills dd{margin:0}
.rs-plain{padding-top:8px !important}
@media (max-width:620px){
  .rs-panel{top:auto;left:0;width:100%;height:92%;border-left:0;border-top:1px solid var(--ink);padding:18px 20px 40px;transform:translateY(100%)}
  .rs-head{padding-top:22px}
  .rs-head h2{font-size:32px}
  .rs-sum{font-size:18px}
  .rs-skills div{grid-template-columns:1fr;gap:4px}
  .rs-org,.rs-role{flex-direction:column;gap:2px}
  .rs-sum{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.rs-veil,.rs-panel,.rs-panel>*{transition:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}.reveal p,.bw{transition:none}}
</style>
<script>(function(){var h=location.hash.slice(1),R=/*REDIRECTS*/{},m=/^report-0*(\d+)$/.exec(h),u=R[m?'report-'+m[1]:h];if(u)location.replace(u)})()</script>
</head>
<body>
<div class="page">
  <header class="bar label">
    <nav aria-label="Elsewhere">
{{links}}
    </nav>
  </header>

  <main>
    <section class="me">
      <div class="id" id="id">
        <picture class="pfp" id="pfp">
          <source type="image/webp" srcset="/assets/img/jeremias-portrait-320.webp">
          <img class="bw" src="/assets/img/jeremias-portrait-320.jpg" alt="{{portrait_alt}}" width="148" height="185">
        </picture>
        <div class="nm">
          <div class="reveal top label" aria-live="polite"><p class="facts">{{facts}}</p></div>
          <div>
            <div class="reveal low label" aria-live="polite"><p class="say">Pronounced <b>{{pronounced}}</b></p></div>
            <h1 class="name" id="name">{{name}}</h1>
          </div>
        </div>
      </div>

      <p class="head">{{headline}}</p>

{{featured}}
    </section>

    <section class="index">
      <div>
        <div class="h label"><span>Work</span><a class="u" href="#resume" data-resume>Résumé →</a></div>
{{work}}
      </div>

      <div>
        <div class="h label">Writing</div>
{{writing}}
      </div>

      <div class="pair">
        <div>
          <div class="h label">{{made_title}}</div>
          <a class="go" href="{{made_href}}"><span>{{made_label}}</span><span>→</span></a>
        </div>
        <div>
          <div class="h label">Elsewhere</div>
          <div class="links">
{{elsewhere}}
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

{{resume}}

<script>
(function () {
  var id = document.getElementById('id'), pfp = document.getElementById('pfp'), name = document.getElementById('name');
  var hover = matchMedia('(hover: hover) and (pointer: fine)').matches;
  // the photo shows where he's from; the name shows how to say it. Hover on a computer, tap on a phone.
  function pair(el, cls) {
    if (hover) {
      el.addEventListener('mouseenter', function () { id.classList.add(cls); });
      el.addEventListener('mouseleave', function () { id.classList.remove(cls); });
    } else {
      el.addEventListener('click', function (e) { e.stopPropagation(); id.classList.toggle(cls); });
    }
  }
  pair(pfp, 'f'); pair(name, 's');
  document.addEventListener('click', function (e) { if (!id.contains(e.target)) id.classList.remove('f', 's'); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape') id.classList.remove('f', 's'); });


  // résumé panel (#resume is linkable)
  var wrap = document.getElementById('resume'), panel = wrap.querySelector('.rs-panel'), last = null, t = 0;
  Array.prototype.forEach.call(panel.children, function (el, i) { el.style.setProperty('--k', Math.min(i, 14)); });
  function openRs() {
    clearTimeout(t); last = document.activeElement; wrap.hidden = false; document.body.classList.add('locked'); panel.scrollTop = 0;
    requestAnimationFrame(function () { requestAnimationFrame(function () { wrap.classList.add('open'); panel.focus({ preventScroll: true }); }); });
  }
  function closeRs() {
    if (wrap.hidden) return;
    wrap.classList.remove('open'); document.body.classList.remove('locked');
    t = setTimeout(function () { wrap.hidden = true; }, 600);
    if (location.hash === '#resume') history.replaceState(null, '', location.pathname + location.search);
    if (last && last.focus) last.focus({ preventScroll: true });
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-resume]')) { e.preventDefault(); history.replaceState(null, '', '#resume'); openRs(); }
    else if (e.target.closest('[data-close]')) { e.preventDefault(); closeRs(); }
  });
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeRs();
    if (e.key === 'Tab' && !wrap.hidden) {   // keep focus inside the panel
      var f = panel.querySelectorAll('a,button'), a = f[0], z = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === a || document.activeElement === panel)) { e.preventDefault(); z.focus(); }
      else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    }
  });
  addEventListener('hashchange', function () { if (location.hash === '#resume') openRs(); else closeRs(); });
  if (location.hash === '#resume') openRs();

  // phones can't hover: the photos turn to colour once they've been on screen for a moment
  if (!hover && 'IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) {
        if (en.isIntersecting) { var el = en.target; setTimeout(function () { el.classList.add('on'); }, 700); io.unobserve(el); }
      });
    }, { threshold: .6 });
    document.querySelectorAll('.bw').forEach(function (el) { io.observe(el); });
  }
})();
</script>
</body>
</html>
