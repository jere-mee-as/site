/* page basics the design was reviewed with */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<style>
/* Layout: one narrow column floating in a time-of-day sky; everything else is air. */
:root{
  --sky-top:#d7e6f2; --sky-bottom:#f3f5f6; --glow:rgba(255,255,255,.75);
  --ink:#1b2129; --ink-2:#333c47; --mute:#56606b; --line:rgba(27,33,41,.12); --shade:rgba(40,60,90,.35);
  --cloud:rgba(255,255,255,.78); --cloud-0:rgba(255,255,255,0);
  --pfp-a:#f7f9fb; --pfp-b:#cdd8e2; --pfp-fg:rgba(60,80,104,.32);
  --focus:#3a6ea5; --star:0;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
:root[data-sky="dawn"]{
  --sky-top:#dfe2ef; --sky-bottom:#f7ede5; --glow:rgba(255,232,210,.85);
  --ink:#1f2229; --ink-2:#383b44; --mute:#585e6a; --line:rgba(31,34,41,.12); --shade:rgba(120,90,80,.3);
  --pfp-a:#fbf6f2; --pfp-b:#d9d4e2; --pfp-fg:rgba(96,84,110,.3);
}
:root[data-sky="dusk"]{
  --sky-top:#d9d3e6; --sky-bottom:#f4ded0; --glow:rgba(255,210,184,.8);
  --ink:#241f27; --ink-2:#3a333c; --mute:#5c5462; --line:rgba(36,31,39,.13); --shade:rgba(120,70,80,.3);
  --cloud:rgba(255,246,240,.85); --cloud-0:rgba(255,246,240,0);
  --pfp-a:#fbf1ea; --pfp-b:#d6cadd; --pfp-fg:rgba(100,72,96,.3);
}
:root[data-sky="night"]{
  --sky-top:#111925; --sky-bottom:#263145; --glow:rgba(150,172,214,.16);
  --ink:#e9edf3; --ink-2:#d0d7e1; --mute:#a3adbb; --line:rgba(233,237,243,.14); --shade:rgba(0,0,0,.6);
  --cloud:rgba(196,210,232,.12); --cloud-0:rgba(196,210,232,0);
  --pfp-a:#3b475b; --pfp-b:#212a39; --pfp-fg:rgba(200,214,234,.22);
  --focus:#9cc0ec; --star:1; color-scheme:dark;
}
html,body{min-height:100%}
body{
  margin:0; background:var(--sky-bottom); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background 2s var(--ease),color 2s var(--ease);
}
a{color:inherit}
button{font:inherit;color:inherit}

/* sky */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;background:
  radial-gradient(70% 45% at 22% 0%,var(--glow),transparent 70%),
  linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 78%)}
.stars{position:absolute;inset:0 0 40% 0;opacity:calc(var(--star)*.7);transition:opacity 2s var(--ease);background:
  radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 27% 8%,#fff,transparent),
  radial-gradient(1.4px 1.4px at 44% 22%,#fff,transparent),radial-gradient(1px 1px at 63% 12%,#fff,transparent),
  radial-gradient(1.2px 1.2px at 78% 28%,#fff,transparent),radial-gradient(1px 1px at 88% 9%,#fff,transparent),
  radial-gradient(1px 1px at 8% 38%,#fff,transparent),radial-gradient(1.2px 1.2px at 56% 36%,#fff,transparent),
  radial-gradient(1px 1px at 93% 41%,#fff,transparent),radial-gradient(1px 1px at 34% 44%,#fff,transparent)}
.layer{position:absolute;inset:-6%;transition:transform 1.6s var(--ease)}
.l1{transform:translate3d(calc(var(--px,0)*3px),calc(var(--py,0)*2px),0)}
.l2{transform:translate3d(calc(var(--px,0)*6px),calc(var(--py,0)*3px),0)}
.l3{transform:translate3d(calc(var(--px,0)*10px),calc(var(--py,0)*5px),0)}
.cl{position:absolute;display:block;filter:blur(6px);will-change:transform;background:
  radial-gradient(34% 46% at 28% 62%,var(--cloud),var(--cloud-0)),
  radial-gradient(30% 54% at 52% 44%,var(--cloud),var(--cloud-0)),
  radial-gradient(38% 40% at 77% 63%,var(--cloud),var(--cloud-0)),
  radial-gradient(60% 26% at 50% 78%,var(--cloud),var(--cloud-0))}
.a{width:58vw;height:24vh;left:-10vw;top:8vh;opacity:.7;animation:drift 170s ease-in-out infinite alternate}
.b{width:44vw;height:18vh;right:-6vw;top:22vh;opacity:.55;animation:drift 150s ease-in-out -60s infinite alternate-reverse}
.c{width:66vw;height:26vh;right:-18vw;top:44vh;opacity:.75;animation:drift 125s ease-in-out -30s infinite alternate}
.d{width:40vw;height:16vh;left:4vw;top:58vh;opacity:.5;animation:drift 140s ease-in-out -80s infinite alternate-reverse}
.e{width:80vw;height:30vh;left:-20vw;bottom:-6vh;opacity:.9;animation:drift 100s ease-in-out -20s infinite alternate}
.f{width:50vw;height:20vh;right:-14vw;bottom:10vh;opacity:.6;animation:drift 115s ease-in-out -50s infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-5vw)}to{transform:translateX(9vw)}}

/* the column */
.stack{position:relative;z-index:1;max-width:360px;margin-inline:auto;padding-inline:12px;padding-block:clamp(120px,26vh,260px) 56px}
.float{animation:bob 14s ease-in-out 4s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.pfp{width:80px;height:80px;margin:0;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,var(--pfp-a),var(--pfp-b));box-shadow:0 0 0 1px var(--line),0 14px 34px -16px var(--shade)}
.pfp img{display:block;width:100%;height:100%;object-fit:cover}
.hi{font-weight:450;font-size:20px;line-height:1.3;letter-spacing:-.012em;margin:28px 0 6px;text-wrap:balance}
.where{font-size:14px;line-height:1.55;color:var(--mute);margin:0 0 40px}
.rows{display:flex;flex-direction:column;gap:6px;margin-left:-24px}
.q{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0;background:none;border:0;text-align:left;font-size:16px;letter-spacing:-.005em;cursor:pointer;border-radius:8px}
.q.sub{font-size:15px;min-height:48px}
.ch{display:inline-flex;width:14px;justify-content:center;color:var(--mute);transition:transform .7s var(--ease),color .5s var(--ease)}
.q:hover .ch{transform:translateX(1.5px);color:var(--ink)}
.q[aria-expanded="true"] .ch{transform:rotate(90deg);color:var(--ink)}
.q:focus-visible,.it:focus-visible,.foot button:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.dd{display:grid;grid-template-rows:1fr}
.js .dd{grid-template-rows:0fr;transition:grid-template-rows .75s var(--ease)}
.js .dd.open{grid-template-rows:1fr}
.dd>div{overflow:hidden;min-height:0}
.ddc{padding:6px 0 22px 24px}
.js .ddc>*{opacity:0;transform:translateY(-2px);filter:blur(2px);transition:opacity .35s ease,transform .4s ease,filter .4s ease}
.js .dd.open>div>.ddc>*{opacity:1;transform:none;filter:none;transition:opacity .8s ease,transform .8s var(--ease),filter .8s ease;transition-delay:calc(.08s + var(--i,0)*.035s)}
.grp{margin:18px 0 2px !important;font-size:12px !important;letter-spacing:.06em;text-transform:uppercase;color:var(--mute) !important}
.ddc>.grp:first-child{margin-top:0 !important}
.ddc p{margin:0 0 14px;font-size:15px;line-height:1.7;color:var(--ink-2)}
.lead{font-size:14px !important;color:var(--mute) !important;margin-bottom:10px !important}
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:12px;padding:11px 0;text-decoration:none;border-radius:6px}
.it .n{display:flex;align-items:center;gap:9px;font-size:15px;line-height:1.35}
.it .s{display:block;margin-top:4px;font-size:13px;line-height:1.4;color:var(--mute)}
.it .ar{font-size:13px;color:var(--mute);transition:transform .6s var(--ease)}
a.it:hover .n{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;text-decoration-color:var(--mute)}
a.it:hover .ar{transform:translate(2px,-2px)}
.it.plain .addr{user-select:all;font-size:15px}
.copy{background:none;border:0;min-height:36px;padding:0 4px;font-size:13px;color:var(--mute);cursor:pointer;border-radius:6px}
.copy:hover{color:var(--ink)}
.copy:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.foot span#where{flex:1}
.foot{position:relative;z-index:1;max-width:360px;margin-inline:auto;padding-inline:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:48px 44px;font-size:12px;color:var(--mute)}
.foot div{display:flex;gap:2px}
.foot button{background:none;border:0;min-height:44px;padding:0 8px;color:var(--mute);cursor:pointer;border-radius:6px;text-transform:capitalize}
.foot button:hover{color:var(--ink)}

/* the intro: everything condenses out of the air */
.play .m{animation:mist 2.1s var(--ease) var(--d,0s) both}
.play .pfp.m{animation-name:bloom;animation-duration:2.3s}
.play .m.fast{animation-duration:1.05s}
.quick.play .m,.quick.play .m.fast,.quick.play .pfp.m{animation-duration:1s;animation-delay:0s}
@keyframes mist{from{opacity:0;transform:translateY(7px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes bloom{from{opacity:0;transform:scale(.975);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){
  .play .m,.play .pfp.m,.float,.cl{animation:none}
  .js .dd,.js .ddc>*,.ch,.layer,body{transition:none}
}

/* readable hierarchy inside panels: grey subtitles, indented entries */
.ddc{padding:8px 0 26px 24px}
.ddc .grp{margin:22px 0 4px !important;font-size:13px !important;font-weight:500;letter-spacing:.01em !important;text-transform:none !important;color:var(--mute) !important;line-height:1.4}
.ddc .grp:first-child{margin-top:4px !important}
.ddc .grp .note{font-weight:400;opacity:.8;margin-left:6px}
.ddc .grp ~ .it,.ddc .grp ~ .tx{margin-left:16px}
.ddc .tx{margin:2px 0 4px;font-size:15px;line-height:1.65;color:var(--ink-2)}
.ddc .it{padding:9px 0}
.it .s2{display:block;margin-top:3px;font-size:13px;line-height:1.45;color:var(--mute);opacity:.85}
.it .n.addr{user-select:all}

.where{margin:0 0 14px !important}
.ln{display:flex;flex-wrap:wrap;align-items:center;gap:0 18px;margin:0 0 4px;font-size:14px}
.ln a,.ln button{display:inline-flex;align-items:center;min-height:36px;padding:0;margin:0;color:var(--mute);text-decoration:none;background:none;border:0;font-family:inherit;font-size:14px;font-weight:400;line-height:1;letter-spacing:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;vertical-align:baseline}
.ln a:hover,.ln button:hover{color:var(--ink)}
.ln a:focus-visible,.ln button:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
.mailnote{margin:0 0 34px;min-height:1.4em;font-size:13px;color:var(--mute);user-select:all;opacity:0;transition:opacity .6s ease}
.mailnote.on{opacity:1}
.foot{justify-content:flex-start}

/* weather: rain and storms dim the sky; lightning flashes it */
.overcast{position:absolute;inset:0;background:linear-gradient(180deg,rgba(96,108,122,.34),rgba(120,128,138,.12) 70%,transparent);opacity:0;transition:opacity 3s var(--ease)}
:root[data-weather="rain"] .overcast{opacity:.7}
:root[data-weather="storm"] .overcast{opacity:1}
:root[data-sky="night"] .overcast{background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 80%)}
:root[data-weather="rain"] .stars,:root[data-weather="storm"] .stars{opacity:0}
:root[data-weather] .cl{filter:blur(7px) grayscale(.35)}
#rain{position:absolute;inset:0;width:100%;height:100%}
.bolt{position:absolute;inset:0;background:radial-gradient(90% 60% at 60% 0%,rgba(255,255,255,.9),rgba(235,240,255,.35) 60%,transparent);opacity:0}
.bolt.on{animation:bolt 1.1s ease-out}
@keyframes bolt{0%{opacity:0}4%{opacity:.55}9%{opacity:.08}14%{opacity:.4}40%{opacity:.05}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#rain,.bolt{display:none}}
.foot{flex-wrap:wrap;gap:6px 18px}
.foot span#where{flex:1 1 auto}
.fb{color:var(--mute);text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.fb:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.foot{flex-direction:column;align-items:flex-start;gap:4px}
.fl{display:flex;flex-wrap:wrap;gap:0 18px}
.fl a{color:var(--mute);text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.fl a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}

/* résumé: a frosted sheet that condenses out of the sky */
:root{--paper:rgba(250,251,252,.88);--veil:rgba(226,233,240,.55)}
:root[data-sky="night"]{--paper:rgba(24,32,46,.9);--veil:rgba(8,12,20,.5)}
.rbtn{width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;margin-bottom:6px}
.rbtn:hover .n{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;text-decoration-color:var(--mute)}
.rbtn:hover .ar{transform:translateX(3px)}
.sheetwrap{position:fixed;inset:0;z-index:30;overflow-y:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.veil{position:fixed;inset:0;background:var(--veil);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .6s ease}
.sheetwrap.open .veil{opacity:1}
.sheet{position:relative;max-width:620px;margin:clamp(20px,7vh,72px) auto 48px;padding:30px 34px 34px;box-sizing:border-box;border-radius:20px;background:var(--paper);-webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1);box-shadow:0 0 0 1px var(--line),0 40px 90px -50px var(--shade);opacity:0;transform:translateY(18px);filter:blur(8px);transition:opacity .9s var(--ease),transform 1s var(--ease),filter .9s var(--ease)}
.sheetwrap.open .sheet{opacity:1;transform:none;filter:none}
.sheetwrap .rs{opacity:0;transform:translateY(6px);transition:opacity .8s ease,transform .8s var(--ease)}
.sheetwrap.open .rs{opacity:1;transform:none;transition-delay:calc(.25s + var(--k,0)*.05s)}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin:-8px 0 18px;font-size:12.5px;color:var(--mute)}
.back{background:none;border:0;padding:0;min-height:40px;font:inherit;font-size:13px;color:var(--mute);cursor:pointer}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
.sheet h2{margin:0;font-weight:500;font-size:24px;letter-spacing:-.015em;line-height:1.2}
.rmeta{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--mute)}
.sel{user-select:all}
.summary{margin:22px 0 0;font-size:15px;line-height:1.7;color:var(--ink-2)}
.sec{margin:34px 0 10px;font-size:13px;font-weight:500;color:var(--mute)}
.job{margin:0 0 22px 16px}
.org{margin:0;font-size:16px;font-weight:500;letter-spacing:-.01em;line-height:1.35}
.org span{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:2px}
.role{margin:14px 0 6px;font-size:14.5px;line-height:1.45;color:var(--ink)}
.role span{display:block;font-size:13px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.note2{margin:4px 0 0;font-size:13px;color:var(--mute)}
.job ul{list-style:none;margin:0;padding:0 0 0 14px}
.job li{position:relative;margin:7px 0;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.job li::before{content:"";position:absolute;left:-12px;top:.78em;width:5px;height:1px;background:var(--mute)}
.skills{margin:0 0 0 16px}
.skills div{margin:0 0 12px}
.skills dt{font-size:13px;color:var(--mute);margin-bottom:2px}
.skills dd{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.sheet-end{margin:36px 0 0;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
body.locked{overflow:hidden}
@media (max-width:520px){.sheet{padding:24px 20px 28px;border-radius:16px}.job,.skills{margin-left:6px}}
@media (prefers-reduced-motion:reduce){.veil,.sheet,.sheetwrap .rs{transition:none}}

/* sky and weather: a small cloud in the corner that opens a panel */
.wx{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#wx-btn{width:44px;height:44px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);background:var(--paper);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 0 1px var(--line),0 12px 30px -16px var(--shade);transition:color .4s,transform .6s var(--ease)}
#wx-btn:hover{color:var(--ink)}
#wx-btn[aria-expanded="true"]{transform:rotate(-8deg)}
#wx-btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.wx-pop{position:absolute;right:0;bottom:56px;width:188px;padding:10px 6px 8px;box-sizing:border-box;border-radius:16px;background:var(--paper);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 0 0 1px var(--line),0 24px 60px -30px var(--shade);opacity:0;transform:translateY(8px);filter:blur(6px);pointer-events:none;visibility:hidden;transition:opacity .5s ease,transform .6s var(--ease),filter .5s ease,visibility 0s .6s}
.wx.open .wx-pop{opacity:1;transform:none;filter:none;pointer-events:auto;visibility:visible;transition:opacity .6s ease,transform .7s var(--ease),filter .6s ease,visibility 0s}
.wl{margin:8px 10px 2px;font-size:12px;font-weight:500;color:var(--mute)}
.wl:first-child{margin-top:2px}
.wx-pop button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:36px;padding:0 10px;border:0;border-radius:10px;background:none;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;text-align:left}
.wx-pop button:hover{background:var(--line)}
.wx-pop button[aria-pressed="true"]{color:var(--ink);font-weight:500}
.wx-pop button[aria-pressed="true"]::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.wx-pop button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.foot{padding-bottom:84px}
@media (prefers-reduced-motion:reduce){.wx-pop,#wx-btn{transition:none}}
.wx{opacity:0;transform:translateY(10px);filter:blur(4px);pointer-events:none;visibility:hidden;transition:opacity .9s ease,transform 1s var(--ease),filter .9s ease,visibility 0s 1s}
.wx.show{opacity:1;transform:none;filter:none;pointer-events:auto;visibility:visible;transition:opacity .9s ease,transform 1s var(--ease),filter .9s ease,visibility 0s}

/* --- build additions (not in v18): self-hosted font, real image, links that work without JavaScript --- */
.pfp picture{display:block;width:100%;height:100%}
a.rbtn:hover .ar{transform:translateX(3px)}
a.back{display:inline-flex;align-items:center;text-decoration:none}
.sheetwrap{display:none}
.js .sheetwrap{display:block}
html:not(.js) .sheetwrap:target{display:block}
html:not(.js) .sheetwrap:target .veil,html:not(.js) .sheetwrap:target .sheet,html:not(.js) .sheetwrap:target .rs{opacity:1;transform:none;filter:none}
.st-r{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:0 16px}
.dl{color:var(--mute);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.dl:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.dl:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
</style>
<script>(function(){var h=location.hash.slice(1),R=/*REDIRECTS*/{},m=/^report-0*(\d+)$/.exec(h),u=R[m?'report-'+m[1]:h];if(u){location.replace(u);return}})();
(function(){var r=document.documentElement;r.classList.add('js','play');try{var t=+localStorage.getItem('jere.seen')||0,n=Date.now();if(n-t<864e5)r.classList.add('quick');localStorage.setItem('jere.seen',n)}catch(e){}})()</script>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="stars"></div>
  <div class="layer l1"><i class="cl a"></i><i class="cl b"></i></div>
  <div class="layer l2"><i class="cl c"></i><i class="cl d"></i></div>
  <div class="layer l3"><i class="cl e"></i><i class="cl f"></i></div>
  <div class="overcast"></div>
  <canvas id="rain"></canvas>
  <div class="bolt"></div>
</div>

<main class="stack">
  <div class="float">
    <figure class="pfp m" style="--d:.2s"><picture><source type="image/webp" srcset="/assets/img/jeremias-portrait-160.webp 160w, /assets/img/jeremias-portrait-320.webp 320w" sizes="80px"><img src="/assets/img/jeremias-portrait-160.jpg" srcset="/assets/img/jeremias-portrait-160.jpg 160w, /assets/img/jeremias-portrait-320.jpg 320w" sizes="80px" alt="{{portrait_alt}}" width="80" height="80"></picture></figure>
    <h1 class="hi m" style="--d:.45s">{{hello}}</h1>
    <p class="where m fast" style="--d:1.75s">{{role}}</p>
    <p class="ln m fast" style="--d:1.95s">{{links}}</p>
    <p class="mailnote" id="mailnote" aria-live="polite"></p>

    <nav class="rows" aria-label="About Jeremias">
{{rows}}
    </nav>
  </div>
</main>


{{resume}}


<div class="wx">
  <div class="wx-pop ctrl" id="wx-pop" aria-label="Sky and weather">
    <p class="wl">Sky</p>
    <button type="button" data-sky="dawn">Dawn</button><button type="button" data-sky="day">Day</button><button type="button" data-sky="dusk">Dusk</button><button type="button" data-sky="night">Night</button>
    <p class="wl">Weather</p>
    <button type="button" data-w="clear">Clear</button><button type="button" data-w="rain">Rain</button><button type="button" data-w="storm">Storm</button>
  </div>
  <button type="button" id="wx-btn" aria-expanded="false" aria-controls="wx-pop" aria-label="Change the sky and weather"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18.5h9.5a4 4 0 0 0 .4-7.98A5.5 5.5 0 0 0 6.4 11.3 3.6 3.6 0 0 0 7 18.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg></button>
</div>
<footer class="foot m fast" style="--d:{{footer_delay}}">
  <span id="where">{{greeting}}</span>
  <span class="fl">{{footer_links}}</span>
</footer>

<script>
(function () {
  var root = document.documentElement;
  var SKIES = ['dawn', 'day', 'dusk', 'night'];
  var where = document.getElementById('where');

  function hourInVirginia() {
    try {
      return +new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' }).format(new Date()) % 24;
    } catch (e) { return new Date().getHours(); }
  }
  function greet(h) {
    if (h >= 5 && h < 12) return 'Good morning from Virginia.';
    if (h >= 12 && h < 17) return 'Good afternoon from Virginia.';
    if (h >= 17 && h < 21) return 'Good evening from Virginia.';
    return 'It’s late here in Virginia.';
  }
  var WEATHER = ['clear', 'rain', 'storm'];
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function localSky() { var h = new Date().getHours(); return h >= 6 && h < 20 ? 'day' : 'night'; }
  var state = { sky: SKIES.indexOf(load('jere.sky')) > -1 ? load('jere.sky') : localSky(), weather: WEATHER.indexOf(load('jere.weather')) > -1 ? load('jere.weather') : 'clear' };
  function applySky() {
    var parts = location.hash.slice(1).split('-');
    var hs = parts.filter(function (p) { return SKIES.indexOf(p) > -1; })[0];
    var hw = parts.filter(function (p) { return WEATHER.indexOf(p) > -1 || p === 'clear'; })[0];
    var sky = hs || state.sky, w = hw || state.weather;
    root.setAttribute('data-sky', sky);
    if (w !== 'clear') root.setAttribute('data-weather', w); else root.removeAttribute('data-weather');
    where.textContent = greet(hourInVirginia());
    rain.set(w === 'clear' ? '' : w);
    Array.prototype.forEach.call(document.querySelectorAll('.ctrl button'), function (btn) {
      var on = btn.getAttribute('data-sky') === sky || btn.getAttribute('data-w') === w;
      btn.setAttribute('aria-pressed', String(on));
    });
  }
  document.querySelector('.ctrl').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    if (btn.hasAttribute('data-sky')) { state.sky = btn.getAttribute('data-sky'); save('jere.sky', state.sky); }
    if (btn.hasAttribute('data-w')) { state.weather = btn.getAttribute('data-w'); save('jere.weather', state.weather); }
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    applySky();
  });
  var rain = (function () {
    var cv = document.getElementById('rain'), bolt = document.querySelector('.bolt');
    var ctx = cv.getContext('2d'), drops = [], mode = '', raf = 0, last = 0, boltT = 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function size() {
      var d = Math.min(2, devicePixelRatio || 1);
      cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    }
    function seed() {
      var n = Math.round(innerWidth * innerHeight / (mode === 'storm' ? 5200 : 9500));
      drops = [];
      for (var i = 0; i < n; i++) drops.push({ x: Math.random() * innerWidth * 1.2, y: Math.random() * innerHeight, l: 9 + Math.random() * 12, v: 520 + Math.random() * 340, a: .35 + Math.random() * .65 });
    }
    function color() { return root.getAttribute('data-sky') === 'night' ? '205,215,235' : '70,86,104'; }
    function frame(t) {
      raf = requestAnimationFrame(frame);
      var dt = Math.min(.05, (t - (last || t)) / 1000); last = t;
      var wind = mode === 'storm' ? .22 : .12, c = color(), base = mode === 'storm' ? .26 : .2;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.lineWidth = 1; ctx.lineCap = 'round';
      for (var i = 0; i < drops.length; i++) {
        var p = drops[i];
        p.y += p.v * dt; p.x -= p.v * wind * dt;
        if (p.y > innerHeight + 20) { p.y = -20; p.x = Math.random() * innerWidth * 1.2; }
        if (p.x < -20) p.x += innerWidth + 40;
        ctx.strokeStyle = 'rgba(' + c + ',' + (base * p.a).toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.l * wind, p.y - p.l); ctx.stroke();
      }
      if (mode === 'storm' && t > boltT) {
        boltT = t + 7000 + Math.random() * 12000;
        bolt.classList.remove('on'); void bolt.offsetWidth; bolt.classList.add('on');
      }
    }
    addEventListener('resize', function () { if (mode) { size(); seed(); } });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (mode && !still && !raf) { last = 0; raf = requestAnimationFrame(frame); }
    });
    return { set: function (m) {
      if (m === mode) return;
      mode = m; cancelAnimationFrame(raf); raf = 0; ctx.clearRect(0, 0, cv.width, cv.height);
      if (!m || still) return;
      size(); seed(); boltT = performance.now() + 2500; last = 0; raf = requestAnimationFrame(frame);
    } };
  })();
  applySky();
  addEventListener('hashchange', applySky);
  setInterval(applySky, 5 * 60 * 1000);

  document.querySelectorAll('.ddc').forEach(function (c) { Array.prototype.forEach.call(c.children, function (el, i) { el.style.setProperty('--i', Math.min(i, 14)); }); });
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.q'));
  buttons.forEach(function (b) {
    var panel = document.getElementById(b.getAttribute('aria-controls'));
    b.setAttribute('aria-expanded', 'false');
    panel.inert = true;
    b.addEventListener('click', function () {
      var open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', String(open));
      panel.classList.toggle('open', open);
      panel.inert = !open;
    });
  });

  if (/^(lab|vault)$/.test(location.hash.slice(1))) {
    history.replaceState(null, '', location.pathname + location.search);
    var pb = document.getElementById('b-projects'); if (pb) { pb.click(); pb.scrollIntoView({ block: 'start' }); }
  }

  var copyBtn = document.getElementById('copy'), note = document.getElementById('mailnote');
  copyBtn.addEventListener('click', function (e) {
    e.preventDefault();
    var t = copyBtn.getAttribute('data-addr');
    note.textContent = t;
    note.classList.add('on');
    function done() { note.textContent = t + ' · copied'; }
    try { navigator.clipboard.writeText(t).then(done, function () {}); } catch (e) {}
  });


  // résumé sheet (#resume is a linkable view)
  var wrap = document.getElementById('resume'), lastFocus = null, closeT = 0;
  wrap.hidden = true;
  Array.prototype.forEach.call(wrap.querySelectorAll('.rs'), function (el, i) { el.style.setProperty('--k', Math.min(i, 16)); });
  function openResume() {
    clearTimeout(closeT); lastFocus = document.activeElement;
    wrap.hidden = false; document.body.classList.add('locked'); wrap.scrollTop = 0;
    requestAnimationFrame(function () { requestAnimationFrame(function () { wrap.classList.add('open'); }); });
    setTimeout(function () { var b = wrap.querySelector('.back'); if (b) b.focus({ preventScroll: true }); }, 50);
  }
  function closeResume() {
    wrap.classList.remove('open'); document.body.classList.remove('locked');
    closeT = setTimeout(function () { wrap.hidden = true; }, 600);
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function syncResume() { if (location.hash === '#resume') { if (wrap.hidden || !wrap.classList.contains('open')) openResume(); } else if (!wrap.hidden) closeResume(); }
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-open-resume]')) { e.preventDefault(); location.hash = 'resume'; }
    else if (e.target.closest('[data-close-resume]')) { e.preventDefault(); history.replaceState(null, '', location.pathname + location.search); closeResume(); }
  });
  addEventListener('keydown', function (e) { if (e.key === 'Escape' && !wrap.hidden) { history.replaceState(null, '', location.pathname + location.search); closeResume(); } });
  addEventListener('hashchange', syncResume);
  syncResume();


  // sky and weather panel
  var wx = document.querySelector('.wx'), wxBtn = document.getElementById('wx-btn'), wxPop = document.getElementById('wx-pop');
  wxPop.inert = true;
  function wxSet(open) { wx.classList.toggle('open', open); wxBtn.setAttribute('aria-expanded', String(open)); wxPop.inert = !open; }
  wxBtn.addEventListener('click', function (e) { e.stopPropagation(); wxSet(!wx.classList.contains('open')); });
  document.addEventListener('click', function (e) { if (wx.classList.contains('open') && !wx.contains(e.target)) wxSet(false); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape' && wx.classList.contains('open')) { wxSet(false); wxBtn.focus(); } });


  function wxShow() { var on = scrollY > 80; if (!on && wx.classList.contains('open')) wxSet(false); wx.classList.toggle('show', on); }
  addEventListener('scroll', wxShow, { passive: true }); wxShow();

  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduced && matchMedia('(pointer: fine)').matches) {
    var raf = 0, px = 0, py = 0;
    addEventListener('pointermove', function (e) {
      px = (e.clientX / innerWidth) * 2 - 1;
      py = (e.clientY / innerHeight) * 2 - 1;
      if (raf) return;
      raf = requestAnimationFrame(function () {
        raf = 0;
        root.style.setProperty('--px', (-px).toFixed(3));
        root.style.setProperty('--py', (-py).toFixed(3));
      });
    });
  }
})();
</script>
</body>
</html>
