<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: full-bleed oscilloscope canvas, quiet control strip along the bottom, player tucked bottom-right */
  :root {
    --bg: #e8edf2;
    --grid: rgba(70, 95, 125, 0.10);
    --line: #1d3654;
    --ink: #3e5268;
    --muted: #8193a6;
    --panel: rgba(255, 255, 255, 0.55);
    --edge: rgba(40, 60, 85, 0.12);
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 12px/1.4 var(--mono);
    overflow: hidden;
    transition: background-color .5s ease, color .5s ease;
    -webkit-font-smoothing: antialiased;
  }
  canvas#scope { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .top {
    position: fixed; top: 20px; left: 24px; right: 24px;
    display: flex; justify-content: space-between; align-items: baseline;
    letter-spacing: .14em; text-transform: uppercase; font-size: 11px;
    pointer-events: none;
  }
  .mark { color: var(--ink); font-weight: 500; }
  .status { color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .live .dot { background: var(--line); box-shadow: 0 0 0 3px var(--edge); }

  .bar {
    position: fixed; left: 24px; right: 304px; bottom: 20px;
    display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center;
    transition: opacity .3s ease, transform .3s ease;
  }
  .group { display: flex; gap: 6px; align-items: center; }
  .label { color: var(--muted); letter-spacing: .14em; text-transform: uppercase; font-size: 10px; margin-right: 4px; }

  input#url {
    width: min(360px, 60vw);
    font: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--edge); border-radius: 3px;
    padding: 8px 10px; outline: none;
    backdrop-filter: blur(8px);
  }
  input#url::placeholder { color: var(--muted); }
  input#url:focus { border-color: var(--line); }

  button {
    font: inherit; color: var(--ink); cursor: pointer;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 3px;
    padding: 8px 12px; letter-spacing: .04em;
    backdrop-filter: blur(8px);
    transition: border-color .15s, background-color .15s;
  }
  button:hover { border-color: var(--line); }
  button:focus-visible, input:focus-visible { outline: 1px solid var(--line); outline-offset: 2px; }
  button.primary { background: var(--line); color: var(--bg); border-color: var(--line); }

  #palettes { flex-wrap: wrap; max-width: 560px; }
  #palettes.collapsed .swatch:not([aria-pressed="true"]) { display: none; }
  .fold {
    width: 22px; height: 22px; padding: 0; border: 0; background: none; backdrop-filter: none;
    display: grid; place-items: center; color: var(--muted);
  }
  .fold:hover { color: var(--line); }
  .fold svg { width: 10px; height: 10px; transition: transform .2s ease; }
  #palettes.collapsed .fold svg { transform: rotate(-90deg); }
  .swatch {
    width: 22px; height: 22px; padding: 0; border-radius: 50%;
    position: relative; overflow: hidden;
  }
  .swatch span { position: absolute; inset: 0; }
  .swatch span:last-child { clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .swatch[aria-pressed="true"] { outline: 1px solid var(--line); outline-offset: 3px; }

  .w { width: 40px; height: 30px; padding: 0 8px; display: grid; place-items: center; }
  .w i { display: block; width: 100%; background: var(--ink); border-radius: 4px; }
  .w[aria-pressed="true"] { border-color: var(--line); }
  .w[aria-pressed="true"] i { background: var(--line); }

  .msg { color: var(--muted); flex-basis: 100%; min-height: 1.4em; }
  .msg.err { color: var(--line); }

  .player {
    position: fixed; right: 24px; bottom: 20px;
    width: 256px; aspect-ratio: 16 / 9;
    border-radius: 4px; overflow: hidden;
    border: 1px solid var(--edge);
    background: var(--panel);
    transition: opacity .3s ease, transform .3s ease;
  }
  .player iframe { width: 100%; height: 100%; display: block; border: 0; }
  .player[data-empty="true"] { display: grid; place-items: center; color: var(--muted); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }

  body.hide-ui .bar, body.hide-ui .player { opacity: 0; transform: translateY(8px); pointer-events: none; }
  body.hide-ui .top { opacity: .0; }

  @media (max-width: 900px) {
    .player { position: fixed; top: 52px; right: 24px; bottom: auto; width: 192px; }
    .bar { right: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="scope"></canvas>

<div class="top">
  <div class="mark">Scope</div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">No signal</span></div>
</div>

<div class="player" id="playerWrap" data-empty="true">Paste a link</div>

<div class="bar" id="bar">
  <form class="group" id="loadForm">
    <input id="url" type="text" autocomplete="off" spellcheck="false"
           placeholder="youtube.com or music.youtube.com link">
    <button type="submit">Load</button>
  </form>

  <div class="group">
    <button class="primary" id="connect" type="button">Connect audio</button>
  </div>

  <div class="group" id="palettes"><span class="label">Color</span></div>
  <div class="group" id="widths"><span class="label">Line</span></div>

  <div class="msg" id="msg">Load a track, press play, then Connect audio and share this tab with "Share tab audio" on. H hides controls, F goes fullscreen.</div>
</div>

<script>
(() => {
  // ---------- palettes ----------
  const PALETTES = {
    cool:   { name: "Cool",   bg: "#e8edf2", line: "#1d3654", ink: "#3e5268", muted: "#8193a6", grid: "rgba(70,95,125,0.10)",  panel: "rgba(255,255,255,0.55)", edge: "rgba(40,60,85,0.12)", scheme: "light" },
    frost:  { name: "Frost",  bg: "#f6f8fa", line: "#4f6f94", ink: "#5a6b7d", muted: "#a2afbd", grid: "rgba(80,110,145,0.08)", panel: "rgba(255,255,255,0.7)",  edge: "rgba(60,80,105,0.10)", scheme: "light" },
    paper:  { name: "Paper",  bg: "#efede8", line: "#1b1b1a", ink: "#3d3c39", muted: "#93918b", grid: "rgba(40,38,34,0.08)",   panel: "rgba(255,255,255,0.5)",  edge: "rgba(30,28,25,0.12)", scheme: "light" },
    night:  { name: "Night",  bg: "#0f1620", line: "#bfd5ea", ink: "#9fb2c6", muted: "#5d6f82", grid: "rgba(160,190,220,0.07)",panel: "rgba(255,255,255,0.04)", edge: "rgba(190,215,240,0.14)", scheme: "dark" },
    slate:  { name: "Slate",  bg: "#262b31", line: "#e6e9ec", ink: "#b7bec6", muted: "#737c86", grid: "rgba(230,235,240,0.06)",panel: "rgba(255,255,255,0.05)", edge: "rgba(230,235,240,0.14)", scheme: "dark" },
    ember:  { name: "Ember",  bg: "#18110e", line: "#eea56b", ink: "#c99b7c", muted: "#7a5d4b", grid: "rgba(240,170,110,0.07)",panel: "rgba(255,255,255,0.04)", edge: "rgba(240,170,110,0.16)", scheme: "dark" },
    redline:mk("Redline", "#0a0a0a", "#e3221c", "dark"),
    poster: mk("Poster",  "#d5241c", "#0d0d0d", "light"),
    crimson:mk("Crimson", "#16090a", "#ff4a3d", "dark"),
    oxblood:mk("Oxblood", "#4a0f12", "#f2ddd6", "dark"),
    signal: mk("Signal",  "#f1ece6", "#c8161d", "light"),
    rose:   mk("Rose",    "#f6e9eb", "#8a1d38", "light"),
    mono:   mk("Mono",    "#000000", "#ffffff", "dark"),
    ink:    mk("Ink",     "#ffffff", "#000000", "light"),
    ocean:  mk("Ocean",   "#0a2231", "#7fd0e3", "dark"),
    mint:   mk("Mint",    "#e6f1ec", "#1d5a48", "light"),
    forest: mk("Forest",  "#0f1914", "#a7d39d", "dark"),
    lilac:  mk("Lilac",   "#ece8f3", "#3c2d68", "light"),
    violet: mk("Violet",  "#14101f", "#c3a6ff", "dark"),
    sand:   mk("Sand",    "#ebe2d2", "#6a4829", "light"),
    sun:    mk("Sun",     "#f3cf3a", "#161616", "light"),
    cobalt: mk("Cobalt",  "#1c3fd1", "#f2f4ff", "dark"),
  };

  // derive UI tones from a background + line pair
  function mk(name, bg, line, scheme) {
    const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const mix = (a, b, t) => "#" + rgb(a).map((v, i) => Math.round(v + (rgb(b)[i] - v) * t).toString(16).padStart(2, "0")).join("");
    const [r, g, b] = rgb(line);
    return {
      name, bg, line, scheme,
      ink: mix(bg, line, 0.78),
      muted: mix(bg, line, 0.45),
      panel: scheme === "dark" ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.35)",
      edge: `rgba(${r},${g},${b},0.18)`,
    };
  }
  const WIDTHS = { hair: 1, fine: 1.75, medium: 3, bold: 5.5 };

  const store = {
    get(k, d) { try { return localStorage.getItem("scope." + k) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem("scope." + k, v); } catch {} },
  };

  let paletteKey = PALETTES[store.get("palette")] ? store.get("palette") : "cool";
  let widthKey = WIDTHS[store.get("width")] ? store.get("width") : "fine";

  const root = document.documentElement;
  function applyPalette(key) {
    paletteKey = key;
    const p = PALETTES[key];
    root.style.setProperty("--bg", p.bg);
    root.style.setProperty("--line", p.line);
    root.style.setProperty("--ink", p.ink);
    root.style.setProperty("--muted", p.muted);
    root.style.setProperty("--grid", p.grid);
    root.style.setProperty("--panel", p.panel);
    root.style.setProperty("--edge", p.edge);
    root.style.colorScheme = p.scheme;
    document.querySelectorAll(".swatch").forEach(b => b.setAttribute("aria-pressed", b.dataset.key === key));
    store.set("palette", key);
  }

  const palWrap = document.getElementById("palettes");
  const fold = document.createElement("button");
  fold.type = "button"; fold.className = "fold";
  fold.innerHTML = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 3.5 5 7l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function setFold(collapsed) {
    palWrap.classList.toggle("collapsed", collapsed);
    fold.setAttribute("aria-expanded", !collapsed);
    fold.setAttribute("aria-label", collapsed ? "Show colors" : "Hide colors");
    fold.title = collapsed ? "Show colors" : "Hide colors";
    store.set("colorsCollapsed", collapsed ? "1" : "0");
  }
  fold.onclick = () => setFold(!palWrap.classList.contains("collapsed"));
  palWrap.appendChild(fold);
  setFold(store.get("colorsCollapsed") === "1");
  for (const [key, p] of Object.entries(PALETTES)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "swatch"; b.dataset.key = key;
    b.title = p.name; b.setAttribute("aria-label", p.name + " colors");
    b.innerHTML = `<span style="background:${p.bg}"></span><span style="background:${p.line}"></span>`;
    b.onclick = () => applyPalette(key);
    palWrap.appendChild(b);
  }

  const wWrap = document.getElementById("widths");
  for (const [key, px] of Object.entries(WIDTHS)) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "w"; b.dataset.key = key;
    b.title = key[0].toUpperCase() + key.slice(1) + " · " + px + "px";
    b.setAttribute("aria-label", b.title);
    b.innerHTML = `<i style="height:${Math.max(1, px)}px"></i>`;
    b.onclick = () => { widthKey = key; store.set("width", key); markWidth(); };
    wWrap.appendChild(b);
  }
  function markWidth() {
    document.querySelectorAll(".w").forEach(b => b.setAttribute("aria-pressed", b.dataset.key === widthKey));
  }
  applyPalette(paletteKey); markWidth();

  // ---------- messages ----------
  const msg = document.getElementById("msg");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  function say(text, err) { msg.textContent = text; msg.classList.toggle("err", !!err); }
  function setLive(on) {
    statusEl.classList.toggle("live", on);
    statusText.textContent = on ? "Live" : "No signal";
    connectBtn.textContent = on ? "Disconnect" : "Connect audio";
  }

  // ---------- YouTube ----------
  function parseYouTube(raw) {
    let u;
    try { u = new URL(raw.trim().startsWith("http") ? raw.trim() : "https://" + raw.trim()); } catch { return null; }
    const host = u.hostname.replace(/^www\.|^m\./, "");
    let id = null;
    if (host === "youtu.be") id = u.pathname.slice(1).split("/")[0];
    else if (host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")) {
      if (u.searchParams.get("v")) id = u.searchParams.get("v");
      else {
        const m = u.pathname.match(/^\/(shorts|embed|live|v)\/([\w-]{6,})/);
        if (m) id = m[2];
      }
    }
    const list = u.searchParams.get("list");
    if (!id && !list) return null;
    return { id, list };
  }

  let player = null, apiReady = false, pending = null;
  window.onYouTubeIframeAPIReady = () => { apiReady = true; if (pending) loadVideo(pending); };
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  const playerWrap = document.getElementById("playerWrap");
  function loadVideo(ref) {
    if (!apiReady) { pending = ref; say("Loading the YouTube player…"); return; }
    playerWrap.dataset.empty = "false";
    if (player) {
      if (ref.id) player.loadVideoById(ref.id);
      else player.loadPlaylist({ list: ref.list, listType: "playlist" });
      return;
    }
    playerWrap.innerHTML = '<div id="yt"></div>';
    const vars = { playsinline: 1, rel: 0, modestbranding: 1, autoplay: 1 };
    if (ref.list) { vars.list = ref.list; vars.listType = "playlist"; }
    player = new YT.Player("yt", {
      videoId: ref.id || undefined,
      playerVars: vars,
      events: {
        onError: e => say("YouTube refused that one (error " + e.data + "). Some tracks block embedding; try another.", true),
      },
    });
  }

  document.getElementById("loadForm").addEventListener("submit", e => {
    e.preventDefault();
    const ref = parseYouTube(document.getElementById("url").value);
    if (!ref) { say("That doesn't look like a YouTube or YouTube Music link.", true); return; }
    loadVideo(ref);
    say(analyser ? "Loaded." : "Loaded. Now Connect audio and share this tab.");
  });

  // ---------- audio capture ----------
  let ctx = null, analyser = null, stream = null, buf = null;
  const connectBtn = document.getElementById("connect");

  function disconnect() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; analyser = null;
    setLive(false);
  }

  connectBtn.addEventListener("click", async () => {
    if (analyser) { disconnect(); say("Disconnected."); return; }
    if (!navigator.mediaDevices?.getDisplayMedia) {
      say("This browser can't share tab audio. Use Chrome or Edge on desktop.", true); return;
    }
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, suppressLocalAudioPlayback: false },
        preferCurrentTab: true,
        selfBrowserSurface: "include",
        systemAudio: "include",
      });
    } catch (err) {
      say(err.name === "NotAllowedError" ? "Share was cancelled." : "Couldn't start sharing: " + err.message, true);
      return;
    }
    const audioTracks = stream.getAudioTracks();
    stream.getVideoTracks().forEach(t => t.stop()); // only need sound
    if (!audioTracks.length) {
      stream.getTracks().forEach(t => t.stop()); stream = null;
      say('No audio came through. Pick "This tab" and turn on "Share tab audio".', true);
      return;
    }
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    const src = ctx.createMediaStreamSource(new MediaStream(audioTracks));
    analyser = ctx.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0;
    src.connect(analyser); // not routed to speakers: the tab already plays it
    buf = new Float32Array(analyser.fftSize);
    audioTracks[0].addEventListener("ended", () => { disconnect(); say("Sharing stopped."); });
    setLive(true);
    say("Connected.");
  });

  // ---------- drawing ----------
  const canvas = document.getElementById("scope");
  const g = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener("resize", resize); resize();

  const N = 1400;               // samples shown per frame
  const ys = new Float32Array(N);
  const shown = new Float32Array(N);
  let gain = 2, t0 = performance.now();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function sample() {
    if (analyser) {
      analyser.getFloatTimeDomainData(buf);
      // rising zero-crossing trigger keeps the trace standing still
      let start = 0;
      const lim = buf.length - N - 1;
      for (let i = 1; i < lim; i++) { if (buf[i - 1] < 0 && buf[i] >= 0) { start = i; break; } }
      let peak = 0;
      for (let i = 0; i < N; i++) { const v = buf[start + i]; ys[i] = v; const a = Math.abs(v); if (a > peak) peak = a; }
      const target = peak > 0.004 ? Math.min(8, Math.max(1, 0.85 / peak)) : gain;
      gain += (target - gain) * 0.04;   // gentle auto-gain so quiet tracks still read
      return gain;
    }
    // idle: a slow, quiet test tone
    const t = reduced ? 0 : (performance.now() - t0) / 1000;
    for (let i = 0; i < N; i++) {
      const x = i / N;
      ys[i] = 0.08 * Math.sin(x * Math.PI * 6 + t * 1.2) + 0.03 * Math.sin(x * Math.PI * 17 - t * 0.7);
    }
    return 1;
  }

  function frameBox() {
    return { left: 24, right: W - 24, top: 60, bottom: H - 140 };
  }

  function frame() {
    const s = getComputedStyle(root);
    g.fillStyle = s.getPropertyValue("--bg").trim();
    g.fillRect(0, 0, W, H);
    const box = frameBox();
    const k = sample();
    const mid = (box.top + box.bottom) / 2;
    const amp = (box.bottom - box.top) / 2 * 0.92;

    // light temporal smoothing so the line feels fluid, not jittery
    for (let i = 0; i < N; i++) shown[i] += (ys[i] * k - shown[i]) * 0.55;

    g.strokeStyle = s.getPropertyValue("--line").trim();
    g.lineWidth = WIDTHS[widthKey];
    g.lineJoin = "round"; g.lineCap = "round";
    g.beginPath();
    const span = box.right - box.left;
    for (let i = 0; i < N; i++) {
      const x = box.left + span * i / (N - 1);
      const y = mid - Math.max(-1, Math.min(1, shown[i])) * amp;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- keys ----------
  addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "h" || e.key === "H") document.body.classList.toggle("hide-ui");
    if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen?.();
      else document.documentElement.requestFullscreen?.().catch(() => {});
    }
  });
})();
</script>
</body>
</html>
